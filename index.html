  main.querySelector('#oR1').onclick=()=>{ ot.r1=!ot.r1; keepY(renderOtherList); };
  main.querySelector('#oNw').onclick=()=>{ ot.nw=!ot.nw; keepY(renderOtherList); };
  main.querySelectorAll('[data-oid]').forEach(b=>b.onclick=()=>{ ot.tabY=window.scrollY; ot.id=b.dataset.oid; render(); });
  if(ot.tabY){ const y=ot.tabY; ot.tabY=0; requestAnimationFrame(()=>window.scrollTo(0,y)); }
}
function tsRdTag(c){
  const sn=seenRec(S.tsx[c.id]);
  return sn.d===today()?`<span class="tag rd1" id="tsRd">✓ 읽었어요${sn.n>1?` · ${sn.n}번째`:''}</span>`:`<span class="tag rd0" id="tsRd">${tsOpenSet(c.id).size}/${c.lines.length} 눌러 보면 ✓</span>`;
}
function tsCnt(c){ const k=tsOpenSet(c.id).size, n=c.lines.length; return k>=n?`<span class="prd on" id="tsCnt">✓ ${n}줄 다 눌러 봄</span>`:`<span class="prd" id="tsCnt">${k}/${n} 눌러 봄</span>`; }
function tsLineHtml(c,l,i){
  const meta=[l.r?`<span>${esc(l.r)}</span>`:'', tsG(l.g), l.f?`<span class="tag fr">${esc(l.f)}</span>`:''].filter(Boolean).join('');
  return `<li class="oxi tsi${tsOpenSet(c.id).has(i)?' did':''}" data-i="${i}"><div class="h"><div class="tx">${tsHl(l.t)}</div></div>
    <div class="more">${l.x?`<div class="tsx"><b>틀린 꼴</b><del>${esc(l.x)}</del></div>`:''}${l.trap?`<div class="tsx"><b>바꿔 나오는 자리</b>${esc(l.trap)}</div>`:''}${l.calc?`<div class="calc" style="margin-top:4px">풀이  ${esc(l.calc)}</div>`:''}${meta?`<div class="tsm">${meta}</div>`:''}</div></li>`;
}
function renderOtherDetail(id){
  const c=tsById(id), list=tsList(c.subj), k=list.indexOf(c), prev=list[k-1], next=list[k+1], n=tsExams(c);
  main.innerHTML=`<div class="reader">
    <div class="row"><button class="linkbtn" id="oList">‹ 타시험 목록</button><span class="muted" style="font-size:12px">${c.subj==='civ'?'민법':'학개론'} ${k+1} / ${list.length}</span></div>
    <h2 class="st">${esc(c.title)}</h2>
    <div>${tsRank(c)}${n?`<span class="tag">올해 ${n}곳</span>`:''}${tsG(c.g)}${c.fresh?'<span class="tag fr">최근 바뀐 제도</span>':''}${tsRdTag(c)}${hasAudio(id,'tsx')?'<button class="chipbtn" id="oListen1" style="margin-top:6px">🔊 이 카드부터 듣기</button>':''}</div>
    ${c.why?`<p class="muted" style="font-size:14px;margin:8px 0 0;line-height:1.55">${esc(c.why)}</p>`:''}
    <div class="sech"><h3>눌러서 확인 ${c.lines.length}줄</h3>${tsCnt(c)}<button class="chipbtn ${ot.hide?'on':''}" id="oHide">${ot.hide?'답 가림':'답 가리기'}</button></div>
    <p class="muted" style="font-size:12px;margin:0 0 2px">${ot.hide?'회색 자리에 들어갈 말을 먼저 떠올리고 줄을 눌러 확인하세요. 다 눌러 보면 ✓ 읽었어요.':'노란 형광펜은 출제자가 바꿔 치는 자리, 빨간 줄은 다른 시험이 실제로 바꿔 낸 틀린 꼴. ✓ 읽었어요는 답을 가리고 눌러 볼 때만 셉니다.'}</p>
    <ul class="oxl ${ot.hide?'hideans':''}" id="tsl">${c.lines.map((l,i)=>tsLineHtml(c,l,i)).join('')}</ul>
    ${c.refs?`<div class="law" style="margin-top:8px">나온 곳: ${esc(c.refs)}</div>`:''}
    ${c.gn?`<div class="law" style="margin-top:4px">공인중개사 기출: ${esc(c.gn)}${c.fresh?' · '+esc(c.fresh):''}</div>`:''}
    <div class="pn">${prev?`<button data-ogo="${prev.id}"><span>‹ 이전</span>${esc(prev.title)}</button>`:'<span style="flex:1"></span>'}${next?`<button class="nx" data-ogo="${next.id}"><span>다음 ›</span>${esc(next.title)}</button>`:'<span style="flex:1"></span>'}</div>
  </div>`;
  main.querySelector('#oList').onclick=()=>{ ot.id=null; ot.tab=c.subj; render(); };
  main.querySelector('#oHide').onclick=()=>{ ot.hide=!ot.hide; keepY(()=>renderOtherDetail(id)); };
  main.querySelectorAll('#tsl .tsi').forEach(li=>li.onclick=()=>{
    if(!ot.hide) return;
    li.classList.toggle('open');
    if(!li.classList.contains('open')) return;
    li.classList.add('did'); tsOpenSet(id).add(+li.dataset.i);
    if(tsOpenSet(id).size>=c.lines.length&&markSeen(S.tsx,id)) save();
    main.querySelector('#tsRd').outerHTML=tsRdTag(c);
    main.querySelector('#tsCnt').outerHTML=tsCnt(c);
  });
  main.querySelectorAll('[data-ogo]').forEach(b=>b.onclick=()=>{ ot.id=b.dataset.ogo; render(); });
  // 듣기(10-27): 이 카드부터 이어서 다음 카드로. 줄마다 ▶ = 그 줄부터(빈칸 문장 → 생각할 틈 → 온전한 문장 → 틀린 꼴). 줄을 펼치지는 않는다
  const ids=list.map(x=>x.id), pa=hasAudio(id,'tsx')&&AU.tsx[id].parts;
  const l1=main.querySelector('#oListen1'); if(l1) l1.onclick=()=>apStart(ids,id,0,'tsx');
  if(pa) main.querySelectorAll('#tsl .tsi').forEach(li=>{ const k='l'+li.dataset.i; if(pa[k]==null) return; li.dataset.psec=k;
    const b=document.createElement('button'); b.className='psec'; b.textContent='▶'; b.setAttribute('aria-label','이 줄부터 듣기');
    b.onclick=ev=>{ ev.stopPropagation(); apStart(ids,id,pa[k],'tsx'); }; li.querySelector('.h').appendChild(b); });
  apMark();
}

function migrate(){
  let n=0; const t=today(); const byId={}; D.cards.forEach(c=>byId[c.id]=c);
  // 다시 시작해도 바뀐 시각은 그대로 둔다: 다른 기기가 새 카드로 공부한 기록이 있으면 그쪽이 이기게
  const restart=id=>{ const st=S.cards[id]; if(!st||st.st===0) return; S.cards[id]={st:1,k:[],last:st.last,due:t,miss:st.miss||0,seen:st.seen||0}; if(SNAP) SNAP['c/'+id]=JSON.stringify(S.cards[id]); n++; };
  if(D.version&&S.dataver!==D.version){ (D.reset||[]).forEach(restart); }
  for(const [id,st] of Object.entries(S.cards)){ const c=byId[id]; if(c&&st.a&&st.a!==c.mode+':'+c.ox) restart(id); }
  if(D.version) S.dataver=D.version;
  if(n){ S.notice=`카드 ${n}장의 질문 방식이나 정답이 바뀌어 그 카드만 기록을 다시 시작합니다.`; }
  save();
}
// 카드 자료가 커져(11-01, 2차 포함 7.8MB·압축 1.6MB) 열 때마다 새로 받지 않는다. 판 번호(cards.ver, 몇 바이트)만 새로 받아
// 폰 캐시에 그 판이 있으면 그것을 쓰고, 없을 때만 cards.json을 받는다(받은 판은 서비스워커가 캐시에 넣고 옛 판은 여기서 지운다).
// 판 번호를 못 받으면(인터넷 끊김) 예전처럼 받으려 하고, 안 되면 서비스워커가 캐시에 남은 판을 준다.
function loadCards(){
  return fetch('cards.ver',{cache:'no-store'}).then(r=>r.ok?r.text():'').catch(()=>'').then(async v=>{
    v=(v||'').trim(); if(!/^[0-9a-f]{6,40}$/.test(v)) v='';
    const url='cards.json?v='+(v||Date.now());
    let res=null;
    try{ if(v&&window.caches) res=await caches.match(url); }catch(e){}
    if(!res) res=await fetch(url);
    const d=await res.json();
    try{ if(v&&window.caches) for(const k of await caches.keys()){ if(k.indexOf('jiugae2-')!==0) continue; const c=await caches.open(k); for(const q of await c.keys()) if(q.url.includes('/cards.json')&&!q.url.endsWith(url)) await c.delete(q); } }catch(e){}
    return d;
  });
}
loadCards().then(d=>{ D=d; for(const [k,q] of Object.entries(D.questions)) q.id=k; migrate(); render(); if(window.splashReady) splashReady(); loadJH(); syncUI(); syncNow(); loadBook().then(()=>{ if(view==='today'&&!session) renderToday(); }).catch(()=>{}); loadPat().then(()=>{ if(view==='today'&&!session) renderToday(); }).catch(()=>{}); }).catch(e=>{ main.innerHTML='<div class="card">카드 자료(cards.json)를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>'; if(window.splashReady) splashReady(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
