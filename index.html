<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기출지우개 : 공인중개사 2027</title>
<meta name="description" content="공인중개사 1차·2차 기출 선지를 OX로 넘기며 확실한 것은 지우고 모르는 것만 남기는 폰 공부 앱">
<meta name="theme-color" content="#f6f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기출지우개 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
// 화면 밝기(10-24 PD): 자동(폰 설정을 따름)·밝게·어둡게. 이 기기에만 두고 동기화하지 않는다(폰은 어둡게, PC는 밝게일 수 있어서).
// 그리기 전에 <html data-theme>를 정해 둬야 켤 때 번쩍이지 않는다.
const THEME_MQ=matchMedia('(prefers-color-scheme: dark)');
function themePref(){ try{ return localStorage.getItem('jiugae2-theme')||'auto'; }catch(e){ return 'auto'; } }
function applyTheme(){
  const p=themePref(), dark=p==='dark'||(p==='auto'&&THEME_MQ.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=dark?'#15161a':'#f6f4ee';
}
applyTheme(); if(THEME_MQ.addEventListener) THEME_MQ.addEventListener('change',applyTheme);
</script>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#15150f; --ink2:#55534b; --muted:#8a877c; --line:#e3e0d6;
  --o:#1b7f5a; --o-bg:#e4f4ec; --x:#c8322b; --x-bg:#fbe8e6; --acc:#2f63d0; --acc-bg:#e7eefb; --warn:#b26a00; --warn-bg:#fff2dc;
  --del:#6b6b6b; --focus:#e8e6df; --cc:rgba(255,212,0,.6); color-scheme:light;
}
:root[data-theme="dark"]{ --bg:#15161a; --card:#1f2127; --ink:#f0eee6; --ink2:#c2bfb5; --muted:#8c897f; --line:#33363e;
  --o:#4cc38a; --o-bg:#173427; --x:#ff6b61; --x-bg:#3a1f1d; --acc:#7aa2ff; --acc-bg:#1f2a44; --warn:#ffb84d; --warn-bg:#3a2d14; --focus:#5a6175; --cc:rgba(255,200,0,.32); color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.5}
/* 한글은 어절(띄어쓰기) 단위로만 줄을 바꾼다(10-24 PD: 'X건/물', '소/멸한다'처럼 낱말 가운데서 끊겨 띄어쓰기가 틀린 듯 보였다). 화면보다 긴 낱말만 쪼갠다 */
body{word-break:keep-all;overflow-wrap:break-word}
.tw td,.tw th{overflow-wrap:anywhere} /* 표 칸은 좁아서, 칸보다 긴 낱말(중앙부동산가격공시위원회)만 쪼개 표가 화면을 넘지 않게 */
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:800;white-space:nowrap}
.top h1 .h1s{font-size:13px;font-weight:700;color:var(--ink2)}
/* 이름이 길어져(11-01 '기출지우개 : 공인중개사 2027') 폰에서는 D-day 줄이 이름 아래로 내려간다 */
.top{flex-wrap:wrap;row-gap:0}
.top .sub{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0%}
main{padding:14px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--acc-bg);color:var(--acc);margin-right:6px;font-weight:700}
.tag.A{background:#fde7ef;color:#b4134a} .tag.B{background:var(--warn-bg);color:var(--warn)} .tag.C{background:var(--line);color:var(--ink2)} .tag.T{background:var(--acc-bg);color:var(--acc)}
[data-theme="dark"] .tag.A{background:#3b1626;color:#ff8ab4}
.qstem{font-size:14px;color:var(--ink2);margin:8px 0 4px}
.passage{font-size:14px;color:var(--ink2);background:var(--bg);border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;border-radius:6px;white-space:pre-wrap}
.ptab{overflow-x:auto;white-space:normal;margin:2px 0}
.ptab table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.4}
.ptab td,.ptab th{border:1px solid var(--line);padding:4px 5px;text-align:center;vertical-align:middle}
.ptab th{background:var(--card);font-weight:700}
.ptab td:first-child{font-weight:600}
.choice{font-size:19px;font-weight:600;margin:10px 0 14px;line-height:1.55}
.choice .red{color:var(--x);text-decoration:line-through;text-decoration-thickness:2px}
.choice .hl{background:#fff3a3;color:#000;border-radius:3px;padding:0 2px}
.choice .focus{background:var(--focus);border-radius:4px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:16px 10px;font-size:20px;font-weight:800;cursor:pointer;color:#fff;touch-action:manipulation}
.btn.o{background:var(--o)} .btn.x{background:var(--x)} .btn.n{background:var(--acc)} .btn.g{background:var(--del)}
.btn.small{font-size:15px;padding:12px 8px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.verdict{font-size:22px;font-weight:900;margin:4px 0}
.verdict.ok{color:var(--o)} .verdict.bad{color:var(--x)}
.reason{margin:8px 0;font-size:16px}
.law{font-size:13px;color:var(--muted)}
.fix{font-size:15px;background:var(--o-bg);color:var(--o);padding:6px 10px;border-radius:8px;margin:6px 0;font-weight:700}
.calc{font-size:14px;white-space:pre-wrap;background:var(--bg);padding:8px 10px;border-radius:8px}
.tip{font-size:14px;background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:8px;margin-top:6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stat div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 8px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--acc);font-weight:800}
nav.tabs button b{display:block;font-size:20px;line-height:1.1}
/* 패턴 듣기(10-25): 아래 탭 바로 위 재생 막대. 화면을 다시 그려도 계속 재생되게 main 밖(body)에 둔다 */
#aplayer{position:fixed;left:0;right:0;bottom:calc(59px + env(safe-area-inset-bottom));z-index:6;max-width:680px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:none;align-items:center;gap:2px;padding:6px 8px}
#aplayer.on{display:flex}
body.aplay{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
#aplayer .pg{position:absolute;top:-1px;left:0;height:2px;background:var(--acc);width:0}
#aplayer button{border:0;background:transparent;color:var(--ink);font-size:19px;padding:6px 7px;cursor:pointer;touch-action:manipulation}
#aplayer .ti{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:0 4px}
#aplayer .ti small{display:block;font-size:11px;color:var(--muted);font-weight:600}
#aplayer button.rt{font-size:13px;font-weight:800;color:var(--acc);border:1.5px solid var(--line);border-radius:999px;padding:3px 8px}
/* 소제목별 듣기(10-25 PD): 결론·소제목 오른쪽 ▶ = 그 부분부터. 지금 읽는 부분은 파란 테두리 */
.psrow{display:flex;align-items:flex-start;gap:8px} .psrow h2{flex:1}
.pblk .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.psec{flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:999px;font-size:11px;cursor:pointer;padding:0 0 0 2px;touch-action:manipulation}
.psrow .psec{margin-top:4px}
.sech .psec{margin-right:auto} .oxi .h .psec{margin-top:-1px}
.secnow{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
details{margin-top:6px} summary{cursor:pointer;color:var(--acc);font-size:14px;font-weight:700}
.list button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px;color:var(--ink);cursor:pointer}
.list .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;min-width:30px;text-align:center;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:700;background:var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.exam .q{margin:14px 0 6px;font-weight:700}
.exam .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;color:var(--ink)}
.exam .opt.sel{border-color:var(--acc);background:var(--acc-bg)}
.exam .opt.right{border-color:var(--o);background:var(--o-bg)} .exam .opt.wrongsel{border-color:var(--x);background:var(--x-bg)}
.sticky-bottom{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
textarea{width:100%;min-height:80px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px;font-size:13px}
.tok{width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:16px;margin-top:6px}
#syncdot{cursor:pointer} #syncdot.err{color:var(--x);font-weight:800}
.card a{color:var(--acc);font-weight:700}
.hide{display:none !important}
.note{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px}
.center{text-align:center}
h2{font-size:17px;margin:14px 0 8px}
.ask{margin:12px 0 2px;font-size:15px;padding:8px 10px;border-radius:10px}
.ask span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ask.truth{background:var(--o-bg)} .ask.pick{background:var(--acc-bg)}
.ask.member{background:var(--acc-bg);font-size:18px;font-weight:800;line-height:1.45}
.qimg{display:block;width:100%;height:auto;margin:10px 0;border-radius:8px;background:#fff;border:1px solid var(--line)}
.opts{margin:8px 0}.opt-r{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}.opt-r.ok{color:var(--o)}
a.btn{display:block;text-align:center;text-decoration:none}
.card.help{border-color:var(--acc)} .card.easy{border-color:var(--o)}
.ins{color:var(--o);font-weight:800;background:var(--o-bg);border-radius:4px;padding:0 4px;margin-left:3px}
.kind{font-size:13px;color:var(--x);margin:2px 0 6px;font-weight:700}
.trap{font-size:14px;background:var(--warn-bg);color:var(--ink);padding:8px 10px;border-radius:8px;margin:6px 0}
.box{font-size:15px;padding:8px 10px;border-radius:8px;margin:8px 0 0;line-height:1.55}
/* 상자 이름(논점·출제 의도·실무에서는)은 한 줄 위에 따로(11-01 PD: 가독성) */
.box>b:first-child{display:block;font-size:12.5px;font-weight:800;margin:0 0 3px;letter-spacing:.02em}
.box.issue{background:var(--acc-bg)} .box.intent{background:var(--x-bg)} .box.practice{background:var(--o-bg)}
.box.issue>b:first-child{color:var(--acc)} .box.intent>b:first-child{color:var(--x)} .box.practice>b:first-child{color:var(--o)}
.jo{font-size:13.5px;line-height:1.6;color:var(--ink2);background:var(--bg);border-left:3px solid var(--line);border-radius:4px;padding:6px 9px;margin-top:6px}
.jo>b:first-child{display:block;font-size:12px;color:var(--muted);margin:0 0 3px;font-weight:800}
.jo .joh{margin-bottom:4px} .jo .jon{font-weight:800;color:var(--acc)} .jo .joc{color:var(--muted)}
.note.pre{white-space:pre-wrap}
/* 해설 강조: 개념어 굵게(.kw), O/X를 가르는 결론 형광 밑줄(.cc), 조문·판례 번호 작은 회색(.lw) */
b.kw{font-weight:800}
.note .kw,.wy .kw,.oxi .kw,.qref .kw{color:var(--ink)}
.cc{font-weight:800;color:var(--ink);background:linear-gradient(transparent 56%,var(--cc) 56%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 1px}
.tip .cc,.opt-r.ok .cc{color:inherit}
/* 어두운 화면에선 반투명 밑줄이 희미해서(10-24 PD) 앞면 형광펜(.hl)처럼 밝은 노랑 바탕에 검은 글자로 칠한다 */
[data-theme="dark"] .cc,[data-theme="dark"] .tip .cc,[data-theme="dark"] .opt-r.ok .cc{background:#ffe680;color:#1a1a00;border-radius:3px;padding:0 2px}
.trap .hl{background:#fff3a3;color:#000;border-radius:3px;padding:0 2px}
.lw{font-size:.8em;color:var(--muted);font-weight:500;letter-spacing:-.01em}
/* 11-01 PD '해설에 볼드·음영': 2차 해설의 기간·금액·인원 숫자 굵게(.nm), 선지 번호 ①·ㄱ 색(.cn),
   판단 틀은 줄마다 나눠 줄머리 굵게·'외우기' 노란 띠(.frm), 조문 원문에서 결론과 같은 말에 형광(.jo .cc) */
b.nm{font-weight:800;color:var(--ink)}
.cn{font-weight:800;color:var(--acc)}
.frm{background:var(--bg);border-radius:10px;padding:2px 10px;margin-top:8px;font-size:14px;line-height:1.6;color:var(--ink2)}
.fr{padding:6px 0;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr .fl{font-weight:800;color:var(--acc);margin-right:6px}
.fr .sep{color:var(--muted);margin:0 3px}
.fr.mem{background:#fff3a3;color:#1a1a00;border:0;border-radius:8px;margin:6px -4px;padding:7px 9px;font-weight:700}
.fr.mem .fl{color:#7a5b00}
.fr.mem b.nm,.fr.mem .cn{color:inherit}
[data-theme="dark"] .fr.mem{background:#463d0c;color:#fff4bf} [data-theme="dark"] .fr.mem .fl{color:#ffd966}
.jo .cc{font-weight:700}
/* 형광 안의 굵은 숫자·개념어·번호·조문 번호는 형광 글자색을 따른다(11-01 PD: 어두운 화면에서 흰 글자가 노랑 위에 묻힘) */
.cc b.nm,.cc .kw,.cc .cn,.cc .lw{color:inherit}
/* ===== 개념서 ===== */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-size:15px;font-weight:800;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font-size:16px;margin-bottom:10px}
.cont{display:block;width:100%;text-align:left;border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:800;margin-bottom:10px;cursor:pointer}
.cont span{display:block;font-size:12px;font-weight:600;opacity:.85}
.linkbtn{border:0;background:transparent;color:var(--acc);font-weight:800;font-size:14px;cursor:pointer;padding:4px 0}
.chap{padding:0;overflow:hidden}
.chap>.hd{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:14px 16px;cursor:pointer}
.chap>.hd b{font-size:16px}
.chap>.hd .meta{font-size:12px;color:var(--muted);margin-top:3px}
.chap .pbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}.chap .pbar i{display:block;height:100%;background:var(--o)}
.chap .secs{border-top:1px solid var(--line);padding:2px 12px 6px}
.chap .intro{font-size:14px;color:var(--ink2);padding:10px 4px 6px;line-height:1.6}
.srow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 4px;cursor:pointer;font-size:15px}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;line-height:1.4}.srow .f{font-size:12px;color:var(--muted);white-space:nowrap}
.srow.read .t{color:var(--muted)}.srow .ck{color:var(--o);font-weight:900;width:14px}
.reader .crumb{font-size:13px;color:var(--muted);margin:2px 0 4px}
.reader h2.st{font-size:22px;margin:4px 0 6px;line-height:1.35}
.reader .lawl{font-size:13px;color:var(--muted);margin-bottom:6px}
.one{background:var(--acc-bg);border-radius:12px;padding:12px 14px;font-size:16.5px;font-weight:700;line-height:1.6;margin:12px 0}
.one small{display:block;font-size:12px;color:var(--acc);font-weight:800;margin-bottom:2px}
.concept{list-style:none;padding:0;margin:6px 0}
.concept li{position:relative;padding:7px 0 7px 14px;line-height:1.7;font-size:16px;border-bottom:1px dashed var(--line)}
.concept li:last-child{border-bottom:0}
.concept li::before{content:'';position:absolute;left:1px;top:17px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.concept li.sub{padding-left:28px;font-size:15px;color:var(--ink2);border-bottom:0;padding-top:2px}
.concept li.sub::before{left:16px;top:12px;background:var(--muted)}
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.tw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
.tw caption{caption-side:top;text-align:left;font-weight:800;font-size:14px;padding:0 0 6px;color:var(--ink)}
.tw th,.tw td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;min-width:64px}
.tw th{background:var(--bg);font-weight:800;font-size:13px}
.tw td:first-child{font-weight:700}
/* 표 행 풀어 쓴 문장(10-25 PD): 행 아래 병합 칸. 패턴 오디오는 표를 이 문장으로만 읽는다 */
.tw tr.trs td{font-weight:500;font-size:13.5px;color:var(--ink2);background:var(--bg);line-height:1.6;border-top:0}
.tw tr.trs .psec{float:left;margin:0 8px 2px 0}  /* 넓은 표는 옆으로 밀리니 ▶는 문장 왼쪽(늘 보이게) */
.sech{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 4px}
.sech h3{font-size:16px;margin:0}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

<script>
// 켤 때 첫 화면(11-01 PD: "실행할 때마다 그럴싸한 모션그래픽이라도 뜨면 더 자주 들어가고 싶을 것 같아").
// 낙서(연필 줄·빨간 ✗)를 지우개가 문질러 지우면 '기출지우개'가 드러나고, 지우개는 위로 튀어 올라 앉는다. 이어서 '공인중개사 2027'(2027에 형광펜),
// 시험까지 D-day(조금 큰 수에서 줄어들며 멈춤), 연속 공부 날·지운 카드 수. 카드 자료를 다 불러오고 그린 뒤(splashReady) 약 2.4초에 걷힌다.
// 누르면 건너뛴다. 동작 줄이기 설정이면 움직임 없이 끝 모습만 잠깐. 자료가 안 오면 6초에 그냥 걷는다.
(()=>{
  const $=id=>document.getElementById(id), sp=$('splash');
  const line=$('spLine'), T=$('spT'), scr=$('spScr'), er=$('spEr'), sub=$('spSub'), hl=$('spHl'), yr=$('spYr'), chip=$('spChip'), stat=$('spStat'), wait=$('spWait'), cv=$('spc'), cx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.content=document.documentElement.dataset.theme==='dark'?'#182c60':'#2f63d0';
  const cl=(v,a,b)=>Math.min(b,Math.max(a,v)), P=(a,b,t)=>cl((t-a)/(b-a),0,1), L=(a,b,p)=>a+(b-a)*p;
  const eo=p=>1-Math.pow(1-p,3), eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, eb=p=>1+2.7*Math.pow(p-1,3)+1.7*Math.pow(p-1,2);
  const TL={enter:[300,560], rub:[560,1320], hop:[1320,1640], sub:[1260,1660], hl:[1560,1860], chip:[1640,1980], cnt:[1680,2200], stat:[1880,2220], end:2400};
  let t0=performance.now(), prev=0, ready=false, out=false, info=null, shown='', front=0, lastX=null, M=null, paths=[], parts=[], glyphs=[], dpr=1, VW=0, VH=0;
  function measure(){
    VW=innerWidth; VH=innerHeight; dpr=Math.min(devicePixelRatio||1,2.5); cv.width=VW*dpr; cv.height=VH*dpr;
    const l=line.getBoundingClientRect(), t=T.getBoundingClientRect(), s=scr.getBoundingClientRect();
    M={W:l.width, H:l.height, lx:l.left, ly:l.top, tx:t.left-l.left, tw:t.width, sx:s.left-l.left, sw:s.width, sh:s.height, ew:er.offsetWidth, eh:er.offsetHeight};
  }
  // 낙서: 위아래로 긁은 연필 줄 + 옅은 물결 + 끝에 빨간 ✗. 그리는 순서대로 선이 그어진다(stroke-dashoffset)
  function scribble(){
    const w=M.sw, h=M.sh, sw=Math.max(3,M.H*.06), R=(a,b)=>a+Math.random()*(b-a);
    let d=`M${w*.04} ${h*R(.45,.6)}`, x=w*.04, up=true;
    while(x<w*.82){ const nx=x+h*R(.13,.2), y=up?h*R(.2,.32):h*R(.66,.8); d+=` Q${(x+nx)/2} ${y+(up?-1:1)*h*.08} ${nx} ${y}`; x=nx; up=!up; }
    let d2=`M${w*.03} ${h*.5}`; for(let i=1;i<=24;i++) d2+=` L${w*.03+w*.79*i/24} ${h*(.5+.13*Math.sin(i/24*Math.PI*6))}`;
    const xs=w*.86, xe=w*.98, ys=h*.24, ye=h*.76;
    scr.setAttribute('viewBox',`0 0 ${w} ${h}`);
    scr.innerHTML=[[d,'rgba(255,255,255,.62)',sw],[d2,'rgba(255,255,255,.3)',sw*.75],[`M${xs} ${ys}L${xe} ${ye}`,'#ff8f87',sw*1.25],[`M${xe} ${ys}L${xs} ${ye}`,'#ff8f87',sw*1.25]]
      .map(([d,c,s])=>`<path d="${d}" stroke="${c}" stroke-width="${s}"/>`).join('');
    paths=[...scr.querySelectorAll('path')].map((p,i)=>{ const n=p.getTotalLength(); p.style.strokeDasharray=n; p.style.strokeDashoffset=n; return {p, n, a:40+i*110, b:(i<2?360:200)+i*110}; });
  }
  // 뒤에 떠오르는 옅은 ○ ✕ ①~⑤
  function seed(){ const G=['○','✕','①','②','③','④','⑤','O','X','✓']; glyphs=Array.from({length:14},()=>({g:G[Math.random()*G.length|0], x:Math.random()*VW, y:Math.random()*VH, s:16+Math.random()*34, a:.05+Math.random()*.08, v:10+Math.random()*22, r:Math.random()*6.28, w:(Math.random()-.5)*.6})); }
  // 지우개 가루: 움직인 만큼 떨어진다
  function crumbs(x,y,n){ for(let i=0;i<n&&parts.length<160;i++) parts.push({x:x+(Math.random()-.5)*M.ew*.55, y:y+Math.random()*4, vx:(Math.random()-.5)*150, vy:-Math.random()*130-20, s:1.6+Math.random()*2.6, life:0, max:.55+Math.random()*.5, c:Math.random()<.35?'255,170,160':'255,255,255'}); }
  function draw(t,dt){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,VW,VH);
    const fin=eo(P(0,700,t)); cx.textAlign='center'; cx.textBaseline='middle';
    for(const g of glyphs){ g.y-=g.v*dt; g.r+=g.w*dt; if(g.y<-50){ g.y=VH+50; g.x=Math.random()*VW; }
      cx.save(); cx.translate(g.x,g.y); cx.rotate(g.r); cx.font=`800 ${g.s}px system-ui,sans-serif`; cx.fillStyle=`rgba(255,255,255,${g.a*fin})`; cx.fillText(g.g,0,0); cx.restore(); }
    parts=parts.filter(p=>(p.life+=dt)<p.max);
    for(const p of parts){ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; cx.fillStyle=`rgba(${p.c},${(1-p.life/p.max).toFixed(3)})`; cx.fillRect(p.x,p.y,p.s,p.s*.8); }
  }
  function getInfo(){
    try{ if(typeof splashInfo==='function') return splashInfo(); }catch(e){}
    return {name:'38회', d:Math.max(0,Math.ceil((new Date('2027-10-30T00:00:00+09:00')-new Date())/86400000)), streak:0, del:0};
  }
  function exit(){ if(out) return; out=true; sp.classList.add('out'); try{ applyTheme(); }catch(e){} setTimeout(()=>{ sp.remove(); removeEventListener('resize',measure); },460); }
  function frame(now){
    if(!sp.isConnected) return;
    const real=now-t0, t=reduce?TL.end+real:real, dt=prev?Math.min(.05,(now-prev)/1000):0; prev=now;
    for(const q of paths) q.p.style.strokeDashoffset=q.n*(1-eo(P(q.a,q.b,t)));
    const W=M.W, mid=M.H*.52, top=-M.H*.62; let x, y, r, s=1, o=1;
    if(t<TL.enter[0]){ o=0; x=-W*.42; y=mid-M.H*.9; r=-40; }
    else if(t<TL.enter[1]){ const p=eo(P(...TL.enter,t)); x=L(-W*.42,0,p); y=L(mid-M.H*.9,mid,p); r=L(-40,-16,p); o=Math.min(1,p*3); }
    else if(t<TL.rub[1]){ const p=P(...TL.rub,t); x=cl(W*eio(p)+Math.sin(p*Math.PI*8)*W*.07*(1-p*.5),0,W); y=mid+Math.sin(p*Math.PI*16)*M.H*.035; r=-16+Math.sin(p*Math.PI*8+.5)*7; }
    else if(t<TL.hop[1]){ const p=P(...TL.hop,t), e=eio(p); x=L(W,W/2,e); y=L(mid,top,e)-Math.sin(p*Math.PI)*M.H*.55; r=L(-16,-380,e); s=L(1,.78,e); }
    else { x=W/2; y=top+Math.sin((t-TL.hop[1])/420)*2.5; r=-20; s=.78; }
    if(t>=TL.enter[1]&&t<TL.rub[1]){ front=Math.max(front,x); if(lastX!=null){ const dx=Math.abs(x-lastX); if(dx>.5) crumbs(M.lx+x, M.ly+mid+M.eh*.32, Math.min(6,dx*.22|0)+(Math.random()<dx*.2?1:0)); } lastX=x; }
    if(t>=TL.rub[1]) front=1e5;
    er.style.opacity=o; er.style.transform=`translate(${x-M.ew/2}px,${y-M.eh/2}px) rotate(${r}deg) scale(${s})`;
    T.style.clipPath=T.style.webkitClipPath=front>=1e5?'none':`inset(0 ${cl(M.tw-(front-M.tx),0,M.tw)}px 0 0)`;
    scr.style.clipPath=scr.style.webkitClipPath=`inset(0 0 0 ${cl(front-M.sx,0,M.sw)}px)`;
    const ps=eo(P(...TL.sub,t)); sub.style.opacity=ps; sub.style.transform=`translateY(${(1-ps)*14}px)`;
    const ph=eo(P(...TL.hl,t)); hl.style.transform=`scaleX(${ph})`; yr.style.color=ph>.45?'#14244d':'';
    if(t>=TL.chip[0]){
      if(!info){ info=getInfo(); const a=[]; if(info.streak>=2) a.push(`🔥 ${info.streak}일 연속`); if(info.del) a.push(`✂ 지운 카드 ${info.del.toLocaleString()}장`); stat.textContent=a.length?a.join(' · '):'오늘부터 하나씩 지워 봅시다'; }
      const pc=P(...TL.chip,t), n=Math.round(L(info.d+45,info.d,eo(P(...TL.cnt,t)))), h=info.d>0?`${info.name} 1·2차까지<b>D-${n}</b>`:`${info.name} 시험 날`;
      chip.style.opacity=Math.min(1,pc*1.6); chip.style.transform=`scale(${L(.86,1,eb(pc))})`; if(h!==shown){ chip.innerHTML=h; shown=h; }
      const pt=eo(P(...TL.stat,t)); stat.style.opacity=pt; stat.style.transform=`translateY(${(1-pt)*8}px)`;
    }
    draw(t,dt);
    if(!out){ if(ready&&real>=(reduce?600:TL.end)) exit(); else if(real>=6000) exit(); else if(real>=TL.end+500) wait.classList.add('on'); }
    requestAnimationFrame(frame);
  }
  window.splashReady=()=>{ ready=true; };
  sp.onclick=()=>{ if(ready) exit(); else t0=Math.min(t0,performance.now()-TL.end); };
  measure(); scribble(); seed(); addEventListener('resize',measure);
  requestAnimationFrame(frame);
})();
</script>

<script>
/* ===== 데이터 ===== */
const CIRC='①②③④⑤';
// 과목(11-01, 38회 1차·2차 동차): 과목마다 40문항·2.5점, 과목 40점 미만 과락, 차수마다 평균 60점 합격. 동차는 1차가 떨어지면 2차 점수를 인정하지 않는다
const SUBJECTS=[
  {id:'rea', part:1, name:'학개론', full:'부동산학개론'},
  {id:'civ', part:1, name:'민법', full:'민법 및 민사특별법'},
  {id:'brk', part:2, name:'중개사법', full:'공인중개사법령 및 중개실무'},
  {id:'pub', part:2, name:'공법', full:'부동산공법'},
  {id:'reg', part:2, name:'공시세법', full:'부동산공시법령 및 부동산세법'},
];
const SUBJ=Object.fromEntries(SUBJECTS.map(x=>[x.id,x.name])), SUBJ_FULL=Object.fromEntries(SUBJECTS.map(x=>[x.id,x.full])), SUBJ_PART=Object.fromEntries(SUBJECTS.map(x=>[x.id,x.part]));
let D=null;              // cards.json
// 사본(10-31): 지금 앱(gichul-jiugae)과 같은 출처(jjangguss-prog.github.io)라 localStorage를 같이 쓴다. 기록이 섞이지 않게 저장 키는 모두 jiugae2·jiugae2-*, 동기화 파일은 jiugae2-sync.json
const SKEY='jiugae2', APP='jiugae2', ORIG_KEY='jiugae', ORIG_SYNC='jiugae-sync'; // ORIG_* = 지금 앱 기록·토큰. 설정의 '지금 앱 기록 가져오기'가 읽기만 한다
let S=load();            // 진행 상태
// 38회(1차·2차 같은 날). 공고(보통 5월) 전이라 지난 몇 해처럼 10월 마지막 토요일로 잡았다. 공고가 나오면 이 줄만 바꾼다
const EXAM_DATE=new Date('2027-10-30T00:00:00+09:00'), EXAM_DAY='2027-10-30', EXAM_NAME='38회';

function load(){ try{ return JSON.parse(localStorage.getItem(SKEY)||'{}'); }catch(e){ return {}; } }
function save(){ stamp(); try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){} }
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysLeft(){ return Math.max(0,Math.ceil((EXAM_DATE-new Date())/86400000)); }
function normalize(){
  S.cards=S.cards||{};      // id -> {st:0새/1학습/2지움, k:근거까지 안 날짜들[], kt:마지막으로 센 시각(ms), last:날짜, due:날짜, miss:틀린 수, seen:본 수}
  S.log=S.log||[];          // {d,subj,ok,id,ts:시각,v:기기} · 되돌린 판단은 {d,ts,v,x:1}만 남는다(voidLog)
  S.exam=S.exam||{};        // round -> {answers:{}, score, date}
  S.minutes=S.minutes||60;
  S.daily=S.daily||{};      // 이 기기의 date -> {new:0, rev:0, sec:0}
  S.confused=S.confused||{}; // id -> 처음 누른 날짜(이해 안 된 카드)
  S.book=S.book||{read:{},last:'',hide:false,subj:'civ'}; S.book.read=S.book.read||{}; // read: 섹션 id -> {n:읽은 날 수, d:마지막 날}
  S.pat=S.pat||{};          // 패턴 id -> {n:본 날 수, d:마지막 본 날} (예전 기록은 '외웠다' 누른 날짜 문자열)
  S.rep=S.rep||{};          // 또 나온 문장 ref -> {n:본 수, ok:맞힌 수, l:마지막 1맞음/0틀림, d:날짜}
  S.tsx=S.tsx||{};          // 타시험 카드 id(K1·R1…) -> {n:본 날 수, d:마지막 본 날} (동기화 단위 s/)
  S.ddo=S.ddo||{};          // 다른 기기의 daily (동기화로 받음)
  S._epoch=S._epoch||0;     // '처음부터'·붙여넣어 불러오기를 누른 시각
  if(!S._ts) S._ts=legacyTs(); // 동기화 단위 -> 바뀐 시각
  S.log.forEach((l,i)=>{ if(!l.ts){ l.ts=dayMs(l.d)+i; l.v=DEV; } });
}

/* ===== 기기 간 동기화 =====
   기록을 단위(카드 한 장, 실전 한 번, 개념서 섹션 하나, 설정 하나)로 나눠 바뀐 시각을 S._ts에 적고,
   기기끼리 합칠 때 단위마다 더 늦게 바뀐 쪽을 쓴다. 하루 공부량은 기기마다 따로 쌓아 더하고, 판단 기록은 합집합.
   저장소는 PD의 GitHub 비공개 gist(사본은 jiugae2-sync.json, 지금 앱의 jiugae-sync.json과 따로). 토큰은 기록과 따로 이 기기에만 둔다(설정의 복사 글에 안 섞이게). */
const DEV=(()=>{ try{ let d=localStorage.getItem('jiugae2-dev'); if(!d){ d=Math.random().toString(36).slice(2,10); localStorage.setItem('jiugae2-dev',d); } return d; }catch(e){ return 'tmp'; } })();
const NOTUNIT=['cards','exam','confused','book','pat','rep','tsx','log','daily','ddo','dataver','notice','_ts','_epoch'];
const UNIT_DEF={'p/minutes':'60','b/last':'""','b/hide':'false','b/subj':'"civ"'}; // 처음 값은 다른 기기 값에 진다
let SNAP=null; // 지난 save() 때의 단위들
function dayMs(d){ const x=Date.parse((d||'')+'T00:00:00+09:00'); return isNaN(x)?1:x; }
function blankCard(s){ return !s||(!s.st&&!s.seen&&!s.miss&&!s.last&&!(s.k&&s.k.length)); }
function units(st){
  const u={}, J=JSON.stringify;
  for(const [k,v] of Object.entries(st.cards||{})) if(!blankCard(v)) u['c/'+k]=J(v);
  for(const [k,v] of Object.entries(st.exam||{})) u['x/'+k]=J(v);
  for(const [k,v] of Object.entries(st.confused||{})) u['f/'+k]=J(v);
  for(const [k,v] of Object.entries(st.book||{})){ if(k==='read'){ for(const [i,d] of Object.entries(v||{})) u['r/'+i]=J(d); } else u['b/'+k]=J(v); }
  for(const [k,v] of Object.entries(st.pat||{})) u['t/'+k]=J(v);
  for(const [k,v] of Object.entries(st.rep||{})) u['e/'+k]=J(v);
  for(const [k,v] of Object.entries(st.tsx||{})) u['s/'+k]=J(v);
  for(const [k,v] of Object.entries(st)) if(!NOTUNIT.includes(k)) u['p/'+k]=J(v);
  return u;
}
function setUnit(key,json){
  const p=key[0], k=key.slice(2);
  const o=p==='c'?S.cards:p==='x'?S.exam:p==='f'?S.confused:p==='r'?S.book.read:p==='b'?S.book:p==='t'?S.pat:p==='e'?S.rep:p==='s'?(S.tsx||(S.tsx={})):S;
  if(json===undefined) delete o[k]; else o[k]=JSON.parse(json);
}
// 동기화 전부터 있던 기록: 카드는 마지막 본 날짜(같은 날이면 본 수), 나머지는 적힌 날짜로 시각을 매긴다
function legacyTs(){
  const ts={};
  for(const [key,j] of Object.entries(units(S))){
    const v=JSON.parse(j), p=key[0];
    ts[key]=p==='c'?(v.last?dayMs(v.last)+Math.min(v.seen||0,999):1)
      :p==='x'?(v&&v.date?dayMs(v.date):1)
      :(p==='f'||p==='r'||p==='t')&&typeof v==='string'?dayMs(v)
      :(p==='e'||p==='t'||p==='r'||p==='s')&&v&&v.d?dayMs(v.d)+Math.min(v.n||0,999)
      :UNIT_DEF[key]===j?0:1;
  }
  return ts;
}

  for(const k in cur) if(cur[k]!==SNAP[k]) S._ts[k]=now;
  for(const k in SNAP) if(!(k in cur)) S._ts[k]=now;
  let i=S.log.length; while(i>0&&!S.log[i-1].ts) i--;

}
function allDaily(){
  const o={};
  for(const m of [S.daily,...Object.values(S.ddo)]) for(const [d,v] of Object.entries(m||{})){ const w=o[d]||(o[d]={new:0,rev:0,sec:0}); w.new+=v.new||0; w.rev+=v.rev||0; w.sec+=v.sec||0; }
  return o;
}
function maxDaily(a,b){
  const o=Object.assign({},a);
  for(const [d,v] of Object.entries(b||{})){ const w=o[d]||{}; o[d]={new:Math.max(w.new||0,v.new||0),rev:Math.max(w.rev||0,v.rev||0),sec:Math.max(w.sec||0,v.sec||0)}; }
  return o;
}
// 원격 기록 R을 S에 합친다. 바뀐 것이 있으면 true
function mergeRemote(R){
  const re=R.epoch||0;
  if(re<S._epoch) return false; // 이 기기에서 '처음부터'·불러오기를 더 늦게 눌렀다: 원격은 덮어쓴다
  if(re>S._epoch){              // 다른 기기에서 눌렀다: 그 기록을 통째로 받는다
    const dv=S.dataver, dd=R.dd||{};
    S=Object.assign({},R.s,{dataver:dv,_epoch:re,_ts:Object.assign({},R.ts),log:R.log||[],daily:dd[DEV]||{},ddo:{}});
    for(const [d,m] of Object.entries(dd)) if(d!==DEV) S.ddo[d]=m;
    normalize(); SNAP=units(S); return true;
  }
  let ch=false; const lu=units(S), ru=units(R.s||{}), rt=R.ts||{};
  for(const key in rt){
    if(rt[key]>(S._ts[key]||0)){ if(ru[key]!==lu[key]){ setUnit(key,ru[key]); ch=true; } S._ts[key]=rt[key]; }
  }
  for(const [d,m] of Object.entries(R.dd||{})){
    if(d===DEV) continue;
    const b=JSON.stringify(S.ddo[d]||{}); S.ddo[d]=maxDaily(S.ddo[d],m); if(JSON.stringify(S.ddo[d])!==b) ch=true;
  }
  // 판단 기록은 합집합. 되돌린 기록(x)은 어느 쪽이든 한 번 x면 x(voidLog)
  const have=new Map(S.log.map(l=>[l.v+'|'+l.ts,l])); let add=0;
  for(const l of R.log||[]){ if(!l.ts) continue; const m=have.get(l.v+'|'+l.ts); if(!m){ S.log.push(l); add++; } else if(l.x&&!m.x){ voidLog(m); ch=true; } }
  if(add){ S.log.sort((a,b)=>a.ts-b.ts); if(S.log.length>3000) S.log=S.log.slice(-3000); ch=true; }
  SNAP=units(S);
  return ch;
}
// 합친 뒤에도 원격에 없는 것이 이 기기에 남았나(그러면 올린다)
function localAhead(R){
  if((R.epoch||0)!==S._epoch) return true;
  const rt=R.ts||{}; for(const k in S._ts) if(S._ts[k]>(rt[k]||0)) return true;
  const rk=new Map((R.log||[]).map(l=>[l.v+'|'+l.ts,l])); if(S.log.slice(-LOGN).some(l=>{ const r=rk.get(l.v+'|'+l.ts); return !r||(l.x&&!r.x); })) return true;
  const dd=R.dd||{}; if(JSON.stringify(S.daily)!==JSON.stringify(dd[DEV]||{})) return true;
  for(const [d,m] of Object.entries(S.ddo)) for(const [day,v] of Object.entries(m)){ const w=(dd[d]||{})[day]; if(!w||w.new<v.new||w.rev<v.rev||w.sec<v.sec) return true; }
  return false;
}

async function gh(path,opt){
  opt=opt||{};
  const r=await fetch(GH+path,{method:opt.method||'GET',cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'},opt.body?{'Content-Type':'application/json'}:{},opt.headers||{}),
    body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok&&r.status!==304){ const e=new Error('GitHub '+r.status); e.status=r.status; throw e; }
  return r;
}
async function ghFind(){
  for(let p=1;p<=5;p++){ const L=await (await gh(`/gists?per_page=100&page=${p}`)).json(); const g=L.find(g=>g.files&&g.files[SFILE]); if(g) return g.id; if(L.length<100) break; }
  return null;
}
async function ghRead(id){
  const r=await gh('/gists/'+id,{headers:lastTag&&lastText?{'If-None-Match':lastTag}:{}});
  if(r.status!==304){
    const g=await r.json(), f=g.files&&g.files[SFILE]; if(!f) return null;
    // 이미 본 것보다 옛 판이 왔다(캐시에서 나온 응답 등): 이걸로 합쳐 올리면 다른 기기 기록을 덮어쓴다(10-31)
    if(lastUpd&&g.updated_at&&g.updated_at<lastUpd){ const e=new Error('stale'); e.stale=true; throw e; }
    lastText=f.truncated?await fetch(f.raw_url,{cache:'no-store'}).then(x=>x.text()):f.content; lastTag=r.headers.get('ETag')||'';
    if(g.updated_at) lastUpd=g.updated_at;
    lastVer=g.history&&g.history[0]?g.history[0].version:'';
  }
  return JSON.parse(lastText);
}
// 지난 판 하나를 받는다. 판 주소는 바뀌지 않아 캐시가 낡을 일이 없다
async function ghRev(id,ver){
  const g=await (await gh('/gists/'+id+'/'+ver)).json(), f=g.files&&g.files[SFILE]; if(!f) return null;
  return JSON.parse(f.truncated?await fetch(f.raw_url,{cache:'no-store'}).then(x=>x.text()):f.content);
}
async function ghWrite(id,text){
  const base=lastVer;
  const r=await gh(id?'/gists/'+id:'/gists',{method:id?'PATCH':'POST',body:id?{files:{[SFILE]:{content:text}}}:{description:'기출 지우개 2 공부 기록 (동기화용, 지우지 마세요)',public:false,files:{[SFILE]:{content:text}}}});
  const g=await r.json(); lastText=text; lastTag=r.headers.get('ETag')||''; if(g.updated_at) lastUpd=g.updated_at;
  const h=g.history||[]; lastVer=h[0]?h[0].version:'';
  // 바로 앞 판이 내가 합친 판이 아니다: 받고 올리는 사이 다른 기기가 올렸다(10-31 00:47, 같은 초에 두 기기가 올림)
  missedVer=base&&h[1]&&h[1].version!==base?h[1].version:'';
  return g.id;
}

let syncP=null, syncAgain=false, dirtyT=null;

// 받아서 합치고, 이 기기에만 있는 게 있으면 올린다
function syncNow(){
  if(!SY.token||!D) return Promise.resolve();
  if(syncP){ syncAgain=true; return syncP; }
  clearTimeout(dirtyT); dirtyT=null; SY.busy=true; syncUI();
  syncP=(async()=>{
    if(!SY.gist){ SY.gist=await ghFind(); lastTag=lastText=''; }

      const t0=Date.now();
      if(SY.gist){ try{ R=await ghRead(SY.gist); }catch(e){ if(e.status!==404) throw e; SY.gist=null; lastTag=lastText=''; } }
      if(Date.now()-t0<20000) break;

    }

    if(!SY.gist) SY.gist=await ghWrite(null,payload());

      for(let i=0;i<3&&missedVer;i++){
        const M=await ghRev(SY.gist,missedVer); missedVer='';
        if(M&&M.app===APP&&mergeRemote(M)){ ch=true; try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){} await ghWrite(SY.gist,payload()); }
      }

    if(e.stale) syncAgain=true;
    SY.err=e.stale?'받은 기록이 옛것이라 이번엔 올리지 않았습니다. 잠시 뒤 다시 맞춥니다.'

      :e.status===403||e.status===404?`GitHub가 거절했습니다(${e.status}). 토큰에 gist 권한이 있는지 확인하세요.`

}

// five = '5문제만'(10-24 PD: 15분 29장은 정오 판단하고 해설까지 읽으면 택도 없다). 한 번에 5장, 복습 2·새 카드 3이고 모자라면 서로 채운다.
// 지운 카드 검사는 오늘 검사한 게 3장이 될 때까지만 그중 한 자리에 끼운다(하루 시간 분량은 '시작'마다 3장).
function buildQueue(five){
  const t=today(), now=Date.now(); const d=S.daily[t]||(S.daily[t]={new:0,rev:0,sec:0});
  const review=[], fresh=[], audit=[]; let wait=0, next=0;
  const fs=focusSubj();
  for(const c of D.cards){
    const s=cardState(c.id);
    if(s.st===2){ audit.push(c); continue; }
    // 1/3·2/3 카드는 마지막으로 맞힌 다음 날부터 나온다. 0/3은 due 날짜대로
    if(s.st===1){ if(!s.k.length){ if(s.due<=t) review.push(c); } else { const at=readyAt(s); if(at<=now) review.push(c); else { wait++; if(!next||at<next) next=at; } } }
    else if(D.questions[c.q].subject===fs) fresh.push(c);
  }
  mixTsx(fresh);
  // 복습: 틀린 수 많은 것 먼저
  review.sort((a,b)=>cardState(b.id).miss-cardState(a.id).miss);
  // 지운 카드 몰래 검사: 하루 3장
  shuffle(audit); const auditPick=audit.slice(0,3);
  if(five){
    const aud=auditPick.length&&auditToday()<3?1:0, n=5-aud;
    const f=Math.min(fresh.length, n-Math.min(review.length,2)), r=Math.min(review.length, n-f);
    const q=[...review.slice(0,r), ...fresh.slice(0,f)];
    if(aud) q.splice(Math.min(q.length,2),0,auditPick[0]);
    return {q, review:review.length, fresh:fresh.length, deleted:audit.length, wait, next, fs};
  }
  // 분량: 60분이면 복습 최대 45 + 새 카드 35 정도. 시간에 비례
  const m=S.minutes; const revN=Math.round(m*0.7), newN=Math.round(m*1.0);
  const q=[...review.slice(0,revN), ...fresh.slice(0,newN)];
  // 검사 카드는 중간중간 끼움
  auditPick.forEach((c,i)=>q.splice(Math.min(q.length, 5+i*8),0,c));
  return {q, review:review.length, fresh:fresh.length, deleted:audit.length, wait, next, fs};
}
// 타시험 OX 카드(사본 10-31, 타시험/ox카드.py): 다른 시험이 올해 낸 논점을 옳은 문장(O)·틀린 문장(X) 한 쌍으로.
// 안 본 카드에서 기출 카드 사이사이에 고르게 끼운다(기출 n장 : 타시험 m장이면 그 비율대로). 타시험 카드끼리는 파일 순서 그대로:
// 한 쌍 중 한 장을 먼저 다 내고 나머지 짝은 그 뒤라, 같은 논점의 O·X가 한자리에 붙어 나오지 않는다.
const isTsx=c=>c.id.slice(0,2)==='T-'||c.id.slice(0,3)==='T2-';   // T2- = 2차 타시험(11-01, 다른 시험 기출 선지 그대로)
function mixTsx(fresh){
  const G=fresh.filter(c=>!isTsx(c)), T=fresh.filter(isTsx);
  if(!G.length||!T.length) return fresh;
  const at=(i,n)=>(i+0.5)/n, out=[]; let i=0, j=0;
  while(i<G.length||j<T.length){ if(j>=T.length||(i<G.length&&at(i,G.length)<=at(j,T.length))) out.push(G[i++]); else out.push(T[j++]); }
  fresh.splice(0,fresh.length,...out); return fresh;
}
// 새 카드 과목(11-01 PD, 38회 동차: 1회독은 한 과목을 쭉 보고 다음 과목으로). 새 카드는 지금 과목(S.focus)에서만 나오고,
// 그 과목 안에서는 cards.json 순서(논점 묶음)대로다. 복습·지운 카드 검사는 모든 과목에서 섞여 나와, 회독이 늘수록 매일 전 과목을 보게 된다.
// 지금 과목의 새 카드가 다 떨어지면 SUBJ_ORDER에서 새 카드가 남은 다음 과목으로 저절로 넘어간다. 오늘 탭 과목 표를 눌러 바꿀 수 있다.
const SUBJ_ORDER=['brk','pub','reg','civ','rea']; // 중개사법(2차 중 쉽고 민법과 이어짐) → 공법(가장 넓어 일찍) → 공시세법(세법은 해마다 바뀌어 늦게) → 1차
function freshBy(){ const o={}; for(const c of D.cards){ const s=S.cards[c.id]; if(!s||!s.st){ const k=D.questions[c.q].subject; o[k]=(o[k]||0)+1; } } return o; }
// PD가 과목 표에서 직접 고른 과목(S.focusUser)은 새 카드가 떨어질 때까지 그대로 둔다. 저절로 잡힌 과목은 매번 SUBJ_ORDER에서
// 새 카드가 남은 첫 과목으로 다시 잡는다(11-01: 2차 카드가 없던 동안 민법으로 잡혔어도, 2차가 들어오면 중개사법부터)
function focusSubj(fb){
  fb=fb||freshBy(); const f=S.focus||'';
  if(f&&fb[f]&&S.focusUser) return f;
  const n=SUBJ_ORDER.find(x=>fb[x])||'';
  if(n!==f||(S.focusUser&&!fb[f])){
    if(f&&n&&n!==f) S.notice=(S.notice?S.notice+' ':'')+(fb[f]?`새 카드는 이제 ${SUBJ[n]}에서 나옵니다(과목 순서: 중개사법 → 공법 → 공시세법 → 민법 → 학개론). 다른 과목은 맨 위 과목 표를 누르면 바뀝니다.`:`✓ ${SUBJ[f]} 새 카드를 다 봤습니다. 이제 새 카드는 ${SUBJ[n]}에서 나옵니다.`);
    S.focus=n; S.focusUser=0; save();
  }
  return n;
}

function markTab(){ const t=SUBVIEW.includes(view)?'more':view; document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v===t)); }

function esc(s){ return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
// 해설 글: **개념어** 굵게, ⟪결론⟫ 형광 밑줄(표시는 앱/강조.py가 넣는다). 조문·판례 번호는 작은 회색으로 물린다.
const LREF=String.raw`(?:[가-힣]{1,15}법\s*)?제?\d{1,4}조(?:의\s?\d+)?(?!\s*원)(?:\s*제?\d+항)?(?:\s*제?\d+호)?(?:\s*(?:본문|단서|전단|후단))?(?:\s*준용)?`;
const LCASE=String.raw`대판\s*\d{4}\.\s*\d{1,2}\.\s*\d{1,2}\.?\s*\d{2,4}[가-힣]{1,3}\d+(?:\s*전원합의체)?`;
const LAWRE=new RegExp(String.raw`\((?:\s*(?:${LREF}|${LCASE}|판례|전원합의체)\s*[,·/]?)+\)|${LREF}|${LCASE}`,'g');
// num(2차 카드): 기간·금액·인원·비율 숫자를 굵게. 단위에 조·항·호가 없어 조문 번호는 안 칠한다. 선지 번호(①·ㄱ)는 색.
// 연도(2025년)는 먼저 잡아 그대로 둔다(뒤돌아보기 정규식은 옛 사파리에서 안 돼서 안 씀).
const NUMRE=/((?:19|20)\d\d\s?년)|\d+\s?분의\s?\d+|\d[\d,.]*(?:\s?[~∼]\s?\d[\d,.]*)?(?:(?:\s?(?:천|만|억))+(?:\s?원)?|\s?(?:원|일|개월|년|월|시간|명|인|%|퍼센트|㎡|제곱미터|미터|층|배|회|개|세대|가구|필지|킬로미터))(?:\s?(?:이내|이상|이하|초과|미만))?/g;
const numB=h=>h.replace(NUMRE,(m,y)=>y?m:`<b class="nm">${m}</b>`);
function md(t,num){
  const h=esc(t).replace(LAWRE,'<span class="lw">$&</span>').replace(/\*\*(.+?)\*\*/g,'<b class="kw">$1</b>').replace(/⟪(.+?)⟫/g,'<span class="cc">$1</span>').replace(/[①-⑳ㄱ-ㅎ]/g,'<span class="cn">$&</span>');
  return num?numB(h):h;
}
// 판단 틀: 줄마다 나눠 줄머리('이름:')를 굵게, '외우기:' 줄은 노란 띠, ' / '는 옅게
function frameHtml(t,num){
  const sep=h=>h.replace(/ \/ /g,' <span class="sep">/</span> ');
  return `<div class="frm">${(t||'').split('\n').filter(l=>l.trim()).map(l=>{
    const m=l.match(/^\*{0,2}([^:：\n*⟪]{1,24}?)\*{0,2}\s*[:：]\s*(.*)$/);
    if(!m) return `<div class="fr">${sep(md(l,num))}</div>`;
    return `<div class="fr${/^외우기/.test(m[1].trim())?' mem':''}"><b class="fl">${md(m[1].trim(),num)}</b>${sep(md(m[2],num))}</div>`;
  }).join('')}</div>`;
}
// 조문 원문에서 결론(⟪⟫)·논점 자리와 같은 말을 찾아 형광. 띄어쓰기는 무시하고 가장 길게 겹치는 곳(6자 이상, 또는 4자 이상이면서 그 말의 절반 이상, 숫자가 있으면 3자)
function joHtml(c,num){
  const jo=c.jo||'', P=[...(c.reason||'').matchAll(/⟪(.+?)⟫/g)].map(m=>m[1]);
  if(c.key&&(c.ox==='O'||c.ox==='Y')) P.push(c.key);
  if(c.swap&&c.swap.to) P.push(c.swap.to);
  const idx=[], J=[]; for(let i=0;i<jo.length;i++) if(!/\s/.test(jo[i])){ idx.push(i); J.push(jo[i]); }
  const spans=[];
  for(const p of P){
    const A=p.replace(/\s|\*\*/g,''); let best=0, end=0, prev=new Array(J.length+1).fill(0);
    for(let i=1;i<=A.length;i++){
      const cur=new Array(J.length+1).fill(0);
      for(let j=1;j<=J.length;j++) if(A[i-1]===J[j-1]){ cur[j]=prev[j-1]+1; if(cur[j]>best){ best=cur[j]; end=j; } }
      prev=cur;
    }
    if(best>=6||(best>=4&&best>=A.length/2)||(best>=3&&/\d/.test(J.slice(end-best,end).join('')))) spans.push([idx[end-best], idx[end-1]+1, best]);
  }
  spans.sort((a,b)=>b[2]-a[2]); const keep=[];
  for(const s of spans) if(keep.length<3&&!keep.some(k=>s[0]<k[1]&&k[0]<s[1])) keep.push(s);
  keep.sort((a,b)=>a[0]-b[0]); let out='', at=0;
  for(const [s,e] of keep){ out+=esc(jo.slice(at,s))+'<span class="cc">'+esc(jo.slice(s,e))+'</span>'; at=e; }
  out+=esc(jo.slice(at));
  return num?numB(out):out;
}
// 조문 상자(11-01 밤 PD: "조문파트가 이상해"). jo는 선지와 맞닿은 구절만이라 호·목이면 결론이 든 머리 문장('다음 각 호의 … 할 수 없다')이
// 빠지고, 항 가운데 구절이면 문장이 끊긴다. 앱/조문머리.py가 법령 원문에서 찾은 johead.json으로 머리 문장을 위에, 호·목은 번호를 붙여 들여 쓰고,
// 끊긴 문장은 앞뒤 글(옅게)로 잇는다. johead.json이 아직 안 왔거나 없는 카드는 예전처럼 jo만
let JH=null;
function loadJH(){ return fetch('johead.json').then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.c) JH=j; }).catch(()=>{}); }
function joBox(c,num){
  const r=(JH&&JH.c[c.id])||{}, hs=(r.h||[]).map(i=>JH.h[i]).filter(Boolean), hl=t=>joHtml(Object.assign({},c,{jo:t}),num);
  return `<div class="jo"><b>조문</b>${hs.map((h,i)=>`<div class="joh" style="padding-left:${i*14}px">${hl(h)}</div>`).join('')}<div class="job" style="padding-left:${hs.length*14}px">${r.n?`<span class="jon">${esc(r.n)}</span> `:''}${r.b?`<span class="joc">${hl(r.b)}</span>`:''}${joHtml(c,num)}${r.a?`<span class="joc">${hl(r.a)}</span>`:''}</div></div>`;
}
function plain(t){ return (t||'').replace(/\*\*|[⟪⟫]/g,''); }

function splashInfo(){

}

// 회독: n회독 = 지우지 않은 카드를 전부 n번 이상 본 상태. 지운 카드는 어느 회독에서나 끝난 것으로 친다.
// 지금 회독 = 지우지 않은 카드 중 가장 적게 본 횟수 + 1
function passInfo(){
  const total=D.cards.length, seen=[], byG={}; let del=0;
  for(const c of D.cards){
    const s=S.cards[c.id], g=D.questions[c.q].grade, G=byG[g]||(byG[g]={t:0,del:0,seen:[]}); G.t++;
    if(s&&s.st===2){ del++; G.del++; } else { const n=s?s.seen||0:0; seen.push(n); G.seen.push(n); }
  }
  const live=seen.length, pass=live?Math.min(...seen)+1:0;
  const doneAt=k=>seen.filter(x=>x>=k).length, done=live?doneAt(pass):0;
  return {total, del, live, pass, done, pct:100*(del+done)/total, at:k=>100*(del+doneAt(k))/total, byG};
}
function pct(x){ return (x>0&&x<1?x.toFixed(1):Math.floor(x))+'%'; }
// 본 기록(패턴 S.pat, 개념서 섹션 S.book.read): {n:본 날 수, d:마지막 본 날}. 열면 저절로 적고 하루에 한 번만 센다.
// '외웠다'·'다 읽었다' 버튼은 부담이라 없앴다(10-20). 예전 기록(버튼 누른 날짜 문자열)은 그날 한 번 본 것으로 읽는다.
function seenRec(v){ return !v?{n:0,d:''}:typeof v==='string'?{n:1,d:v}:v; }
function markSeen(o,id){ const s=seenRec(o[id]), t=today(); if(s.d===t) return false; o[id]={n:s.n+1, d:t}; return true; }
// 회독: 지금 회독 = 가장 적게 본 것의 본 날 수 + 1, done = 이번 회독에 본 수
function seenPass(o,ids){ const ns=ids.map(id=>seenRec(o[id]).n), pass=Math.min(...ns)+1; return {pass, done:ns.filter(n=>n>=pass).length, total:ns.length}; }
function render(){ header(); window.scrollTo(0,0); ({today:renderToday, more:renderMore, pat:renderPat, other:renderOther, book:renderBook, concepts:renderConcepts, exam:renderExam, stats:renderStats, settings:renderSettings})[view](); }

// 오늘 탭 '전체 진도': 몇 회독째인지, 그 회독이 몇 % 됐는지

  const chips=[p.pass,p.pass+1,p.pass+2].map(k=>`<span class="${k===p.pass?'on':''}">${k}회독 ${pct(p.at(k))}</span>`).join('');
  return `<div class="card prog">
    <div class="hd"><span class="ps">전체 진도</span><span class="muted" style="font-size:12px">카드 ${p.total.toLocaleString()}장</span></div>

function mdw(d){ const x=new Date(d+'T00:00:00'); return `${x.getMonth()+1}/${x.getDate()}(${'일월화수목금토'[x.getDay()]})`; }
// 과목 표: 과목마다 회독·지움, 새 카드가 나오는 과목(▶). 새 카드가 남은 다른 과목을 누르면 그 과목으로 바꾼다
function subjHtml(){
  const fb=freshBy(), fs=focusSubj(fb), by={};
  for(const c of D.cards){ const k=D.questions[c.q].subject, s=S.cards[c.id], o=by[k]||(by[k]={t:0,del:0,seen:[]}); o.t++; if(s&&s.st===2) o.del++; else o.seen.push(s?s.seen||0:0); }
  return `<div class="subj">${SUBJECTS.map(x=>{ const o=by[x.id];
    if(!o) return `<div class="sr none"><span class="nm">${x.name}<i>${x.part}차</i></span><span class="muted">카드 만드는 중</span></div>`;
    const pass=o.seen.length?Math.min(...o.seen)+1:0, done=o.seen.filter(n=>n>=pass).length, pc=pass?100*(o.del+done)/o.t:100;
    const on=x.id===fs, can=!on&&fb[x.id], tg=can?`button data-focus="${x.id}"`:'div';
    return `<${tg} class="sr${on?' on':''}"><span class="nm">${on?'▶ ':''}${x.name}<i>${x.part}차</i></span><span>${pass?`${pass}회독 ${pct(pc)}`:'다 지움'}</span><span class="muted">${on?`새 카드 ${fb[x.id]} · `:''}지움 ${o.del}/${o.t}</span></${can?'button':'div'}>`; }).join('')}</div>`;
}
// 지금 속도로 새 카드를 언제 다 보나. 새 카드는 '시작' 한 번에 하루 시간(분)만큼 나온다
function paceHtml(p){
  const t=today(), lastDay=addDays(EXAM_DAY,-1); if(t>lastDay) return '';
  const fb=freshBy(), all=Object.values(fb).reduce((a,b)=>a+b,0), fs=focusSubj(fb);
  const empty=SUBJECTS.filter(x=>!D.cards.some(c=>D.questions[c.q].subject===x.id)).map(x=>x.name);
  const note=`<div class="muted" style="font-size:12.5px;margin-top:2px">새 카드는 ▶ 과목에서만, 복습은 모든 과목에서 나옵니다.${empty.length?` ${empty.join('·')} 카드는 만드는 중이라 들어오면 새 카드가 늘어납니다.`:''}</div>`;
  if(!all) return `<div class="pace">새 카드는 다 봤습니다. 회독은 복습 카드로 저절로 채워집니다.${note}</div>`;
  const per=Math.round(S.minutes*1.0), todayLeft=Math.max(0,per-((allDaily()[t]||{}).new||0));
  const fin=rem=>rem<=todayLeft?t:addDays(t,Math.ceil((rem-todayLeft)/per));
  const endAll=fin(all);
  return `<div class="pace">하루 새 카드 ${per}장이면 ${fs?`${SUBJ[fs]} <b>${mdw(fin(fb[fs]))}</b> · `:''}있는 카드 전부 <b>${mdw(endAll)}</b>${endAll<=lastDay?' · 시험 전 ✓':''}${note}</div>`;
}
// 카드에서 많이 틀린 논점을 개념서 섹션으로 묶어 보여 준다
function weakHtml(){

  if(!Object.keys(byQ).length) return `<div class="card"><b>개념서</b><p class="muted" style="margin:4px 0 8px">카드를 넘기다 틀린 논점이 생기면 여기에 그 논점의 개념서 섹션이 뜹니다.</p><button class="bookbtn" style="margin-top:0" id="toBook">📖 개념서 목차 열기</button></div>`;

function accuracy(){
  const res={};
  for(const {id:subj} of SUBJECTS){
    const L=S.log.filter(l=>l.subj===subj).slice(-120);
    const n=L.length, ok=L.filter(l=>l.ok).length;
    // 찍기 보정: 정확도 p → 5지선다 기대 정답률 대략 p^(1.6) (선지 4~5개를 다 맞혀야 한 문항이 맞는다는 보수적 보정)
    const p=n?ok/n:0; const expected=n?Math.round(Math.pow(p,1.6)*100):0;
    res[subj]={n, acc:Math.round(p*100), score:n?expected:'-'};
  }
  const avg=(ids,k)=>ids.every(x=>res[x].n)?Math.round(ids.reduce((a,x)=>a+res[x][k],0)/ids.length):'-';
  for(const part of [1,2]){ const ids=SUBJECTS.filter(x=>x.part===part).map(x=>x.id); res['p'+part]={score:avg(ids,'score'), acc:avg(ids,'acc')}; }
  res.avg=res.p1.score;
  return res;
}
// 예상 점수(k='score')·판단 정확도(k='acc') 표: 1차·2차 줄마다 과목들과 그 차수 평균. 과락(40 미만)은 빨갛게
function scoreHtml(acc,k){
  const u=k==='acc'?'%':'';
  return [1,2].map(part=>{ const L=SUBJECTS.filter(x=>x.part===part), av=acc['p'+part][k];
    return `<div class="muted" style="font-size:12.5px;margin-top:8px;font-weight:700">${part}차</div><div class="stat${L.length>2?' s4':''}" style="margin-top:4px">${L.map(x=>{ const a=acc[x.id]; return `<div><b${k==='score'&&a.n&&a.score<40?' style="color:var(--x)"':''}>${a.n?a[k]+u:'-'}</b><span>${x.name}${a.n?` (${a.n}장)`:''}</span></div>`; }).join('')}<div><b>${av}${av==='-'?'':u}</b><span>${part}차 평균</span></div></div>`; }).join('');
}

function timerText(){ const e=Math.floor((Date.now()-session.startAt)/1000); if(session.five) return '걸린 '+fmt(e); const left=S.minutes*60-e; return (left>=0?'남은 ':'초과 ')+fmt(Math.abs(left)); }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function endSession(){

// 보기 박스. 2차 표 문항은 칸을 ' | '로 나눠 옮겼다(11-01): 이어지는 그런 줄을 표로 그린다(첫 줄 = 머리, 칸이 모자란 줄은 끝 칸을 늘림)
function passageHtml(P){
  const out=[]; let rows=[];
  const flush=()=>{ if(!rows.length) return; const n=Math.max(...rows.map(r=>r.length));
    out.push(`<div class="ptab"><table>${rows.map((r,i)=>`<tr>${r.map((x,j)=>{ const sp=j===r.length-1&&r.length<n?` colspan="${n-r.length+1}"`:''; return i===0?`<th${sp}>${esc(x)}</th>`:`<td${sp}>${esc(x)}</td>`; }).join('')}</tr>`).join('')}</table></div>`); rows=[]; };
  for(const l of P){ if(/ \| |^\| /.test(l)) rows.push(l.split(/\s*\|\s*/).map(x=>x.trim())); else { flush(); out.push(esc(l)); } }
  flush(); return out.join('\n');
}
function markChoice(text, wrong){
  if(!wrong||!text.includes(wrong)) return esc(text);
  const i=text.indexOf(wrong);
  return esc(text.slice(0,i))+'<span class="red">'+esc(wrong)+'</span>'+esc(text.slice(i+wrong.length));
}

    wait:['',`지우기까지 ${dots(res.n)} ${res.n}/${N} · 오늘은 이미 셌습니다 · 내일부터 또 셉니다`],
    miss:['bad',res.prev?`연속 ${res.prev}번이 끊겼습니다 · 0/${N}부터 다시`:`지우기까지 ${dots(0)} 0/${N} · 다시 나옵니다`],
    audit:['ok','지운 카드 검사 통과 · 그대로 지워 둡니다'],
    revive:['bad','지운 카드였는데 틀려서 되살렸습니다 · 0/'+N+'부터 다시'],
    kept:['up',`↩ 지우지 않고 남겼습니다 · 0/${N}부터 다시, 내일 또 나옵니다`],
  }[res.r];
  return `<div class="streak ${m[0]}">${m[1]}</div>`;
}
// 지우기 시험(10-20 PD: 자주 봐서 답만 외운 카드가 원리도 모른 채 지워질까 봐).
// 이번 정답으로 지워질 카드와 지운 카드 검사는, 논점 자리가 반대인 문장을 반반 확률로 낸다.
// 그대로 둔 문장도 섞어야 '이번엔 뒤집혔겠지'로 맞히지 못한다. 실전처럼 회색 칠도 뺀다.
// 반대 문장(10-24 PD: 기출된 적 없는 변형은 억지다): ① 다른 회차에 실제로 나온 쌍둥이 기출(cards.json tw, 118장,
// 글자 유사도로 찾고 같은 명제·같은 발문 맥락인지 손으로 골랐다) ② 없으면 틀린 말 카드만 바로잡은 옳은 문장.
// 옳은 말 카드를 지어낸 말로 틀리게 바꾼 문장은 내지 않는다. 바꿀 문장이 없는 카드는 예전처럼 낸다.
function willDelete(st){ return st.st===1&&st.k.length===STREAK_N-1&&Date.now()>=readyAt(st); }
function testForm(c,st){
  const audit=st.st===2, f=audit||willDelete(st)?flipOf(c):null;
  return {tag:audit?'지운 카드 검사':f?'지우기 시험':'', test:!!f, flip:f&&Math.random()<0.5?f:null};
}
function edPlain(t,ed){ let b='', last=0; for(const [p,f,to] of ed){ b+=t.slice(last,p)+(to||''); last=p+f.length; } return (b+t.slice(last)).replace(/ {2,}/g,' ').replace(/ +([,.])/g,'$1').trim(); }
// 이 카드 원래 기출 문장을 칠한 글(틀린 말은 바꿔친 말에 줄, 옳은 말은 형광펜 자리)
function origHtml(c){
  const t=c.text||'';
  if(c.ox==='X'&&c.ed&&c.ed.length) return edPair(t,c.ed).a;
  if(c.key&&t.includes(c.key)){ const p=t.indexOf(c.key); return esc(t.slice(0,p))+'<span class="hl">'+esc(c.key)+'</span>'+esc(t.slice(p+c.key.length)); }
  return esc(t);
}
// {ox:반대 문장의 정답, text:앞면 글, a:뒷면에 칠한 글, real:실제 기출이면 'N회 M번', fix·why: 그 기출의 바로잡기·근거}
function flipOf(c){
  if(c.mode!=='truth') return null;
  const t=c.text||'', w=c.tw;
  if(w){ const p=w.r.split('-'), ed=w.ed&&w.ed.length;
    return {ox:w.ox, text:w.t, real:`${p[0]}회 ${p[1]}번`, a:ed?edPair(w.t,w.ed,true).a:esc(w.t),
      fix:w.ox==='X'?(ed?edPair(w.t,w.ed).b:esc(w.fx||'')):'', why:w.w||''}; }
  if(c.ox==='X'&&c.ed&&c.ed.length) return {ox:'O', text:edPlain(t,c.ed), a:edPair(t,c.ed).b};
  return null;
}
function flipNote(c,F){
  const f=F.flip, og=`<div class="og">이 카드의 ${isTsx(c)?'':'기출 '}문장(${c.ox==='O'?'옳은 말':'틀린 말'}): ${origHtml(c)}</div>`;
  if(!f) return `<div class="flipnote"><b>${F.tag} · 이번엔 이 카드의 ${isTsx(c)?'':'기출 '}문장 그대로였습니다</b></div>`;
  if(f.real) return `<div class="flipnote"><b>${F.tag} · 이번 문장은 ${f.real}에 실제로 나온 기출입니다(정답 ${f.ox})</b>${f.fix?`<div class="fix">바로잡기: ${f.fix}</div>`:''}${f.why?`<div class="wy2">${md(f.why)}</div>`:''}${og}</div>`;
  return `<div class="flipnote"><b>${F.tag} · 이 카드의 틀린 ${isTsx(c)?'':'기출 '}문장을 바로잡은 옳은 문장이었습니다</b>${og}</div>`;
}

function qimgHtml(src,alt,textHtml){ return `<img class="qimg" src="${src}" alt="${alt}" data-try="0" onerror="qimgFail(this)"><div class="qimgtx" hidden>${textHtml}</div>`; }
function qimgFail(im){
  if(im.dataset.try==='0'){ im.dataset.try='1'; im.src=im.getAttribute('src').split('?')[0]+'?r='+Date.now(); return; }
  im.style.display='none'; const t=im.nextElementSibling; if(t&&t.classList.contains('qimgtx')) t.hidden=false;
}
function renderExamPaper(){
  const qs=Object.values(D.questions).filter(q=>!q.tsx&&+q.round===exam.round&&q.subject===exam.subj).sort((a,b)=>a.no-b.no);
  let html=`<div class="exam"><div class="row"><b>${exam.round}회 ${SUBJ_FULL[exam.subj]}</b><button class="btn ghost small" style="flex:0 0 auto;padding:6px 10px" id="exit">나가기</button></div>`;
  for(const q of qs){
    const qt=`<div class="q">${q.no}. ${esc(q.question)}</div>${q.passage.length?`<div class="passage">${passageHtml(q.passage)}</div>`:''}`;
    html+=q.img?qimgHtml(q.img,`${q.no}번 문제 원문`,qt):qt;
    q.choices.forEach((t,i)=>{ const sel=exam.answers[q.no]===i+1; let cls='opt'+(sel?' sel':''); if(exam.done){ if(q.all_correct?sel:(q.answers||[q.answer]).includes(i+1)) cls+=' right'; else if(sel) cls+=' wrongsel'; } html+=`<button class="${cls}" data-q="${q.no}" data-i="${i+1}">${CIRC[i]} ${esc(t)}</button>`; });
    if(exam.done&&q.core) html+=`<div class="note">${md(q.core)}</div>`;
  }
  const n=Object.keys(exam.answers).length;
  html+=`<div class="sticky-bottom">${exam.done?`<div class="card center"><div class="verdict ${exam.score>=40?'ok':'bad'}">${exam.score}점</div><p class="muted">40점 미만이면 과락, 평균 60점이면 합격</p></div>`:`<div class="btns"><button class="btn n" id="grade">채점 (${n}/40 표시함)</button></div>`}</div></div>`;
  main.innerHTML=html;
  main.querySelector('#exit').onclick=()=>{ if(exam.done||confirm('채점하지 않고 나갈까요?')){ exam=null; renderExam(); } };
  if(!exam.done){ main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ exam.answers[+b.dataset.q]=+b.dataset.i; renderExamPaper(); window.scrollTo(0, b.getBoundingClientRect().top+window.scrollY-120); }); main.querySelector('#grade').onclick=gradeExam; }
}
function gradeExam(){
  const qs=Object.values(D.questions).filter(q=>!q.tsx&&+q.round===exam.round&&q.subject===exam.subj);
  let right=0;
  for(const q of qs){ const ok=q.all_correct?!!exam.answers[q.no]:(q.answers||[q.answer]).includes(exam.answers[q.no]); if(ok) right++; else { for(const c of D.cards){ if(c.q===q.id){ const st=cardState(c.id); if(st.st===2){ st.st=1; } st.k=[]; st.due=today(); st.miss++; } } } }
  exam.done=true; exam.score=Math.round(right*2.5);
  S.exam[exam.round+exam.subj]={score:exam.score,date:today(),right}; save(); renderExamPaper(); header();
}

}

let B=null, bookLoading=null, Q2S={};
const bk={sec:null, from:null, q:'', memo:false, open:{}, tocY:0, wrong:false};
function bookState(){ return S.book||(S.book={read:{},last:'',hide:false,subj:'civ'}); }
function loadBook(){
  if(B) return Promise.resolve(B);
  if(!bookLoading) bookLoading=fetch('book.json?v='+Date.now()).then(r=>r.json()).then(d=>{ B=d; Q2S={}; for(const s of Object.values(B.sections)) for(const q of s.refs) (Q2S[q]=Q2S[q]||[]).push(s.id); return B; }).catch(e=>{ bookLoading=null; throw e; });
  return bookLoading;
}
function rlabel(ref){ const p=ref.split('-'); return `${p[0]}회 ${p[1]}번`; }
function subjSecs(subj){ const out=[]; for(const cid of B.subjects.find(x=>x.id===subj).chapters) out.push(...B.chapters[cid].sections); return out; }
function freqLabel(s){ return `10년 ${s.f10}회${s.f5?` · 최근5년 ${s.f5}`:''}`; }

function renderToc(){
  const st=bookState(); const subj=st.subj||'civ'; const sb=B.subjects.find(x=>x.id===subj);
  const last=st.last&&B.sections[st.last];
  const bp=seenPass(st.read,subjSecs(subj)), rd=id=>seenRec(st.read[id]).n>=bp.pass; // 과목마다 회독
  let html=`<div class="seg">${B.subjects.map(x=>`<button data-subj="${x.id}" class="${x.id===subj?'on':''}">${x.id==='civ'?'민법':'학개론'}</button>`).join('')}</div>
  <input class="search" id="bks" type="search" placeholder="개념서 검색 (예: 유치권, 저당상수)" value="${esc(bk.q)}">

  <div class="row" style="margin:0 2px 10px"><span class="muted">${sb.name} · ${bp.pass===1?'읽은 섹션':bp.pass+'회독'} ${bp.done}/${bp.total}</span><button class="linkbtn" id="memo">외우기 모음${AU&&AU.memo?' · 🔊 듣기':''} ›</button></div>`;
  if(bk.q.trim()) html+=searchResults(bk.q.trim());
  else {
    for(const cid of sb.chapters){
      const ch=B.chapters[cid]; const r=ch.sections.filter(rd).length, n=ch.sections.length; const open=bk.open[cid];
      html+=`<div class="card chap"><button class="hd" data-ch="${cid}"><div class="row"><b>${esc(ch.title)}</b><span class="muted" style="font-size:13px">${open?'접기':'펼치기'}</span></div>
        <div class="meta">10년 ${ch.nq}문항 출제(한 해 약 ${ch.per_round}문항) · 섹션 ${n}개 · 읽음 ${r}/${n}</div><div class="pbar"><i style="width:${n?Math.round(100*r/n):0}%"></i></div></button>
        ${open?`<div class="secs">${ch.intro?`<div class="intro">${md(ch.intro)}</div>`:''}${(ch.tables||[]).map(tableHtml).join('')}${ch.sections.map(id=>{ const s=B.sections[id]; return `<button class="srow ${rd(id)?'read':''}" data-sec="${id}"><span class="ck">${rd(id)?'✓':''}</span><span class="tag ${s.grade}">${s.grade}</span><span class="t">${esc(s.title)}</span><span class="f">${s.f10}회</span></button>`; }).join('')}</div>`:''}
      </div>`;
    }
    html+=`<p class="muted" style="font-size:12px;margin:4px 2px 0">A = 10년 중 6개 회차 이상 출제(꼭 읽기), B = 4~5회, C = 3회 이하. 오른쪽 숫자는 10년 중 출제 회차 수.<br>섹션을 열기만 하면 ✓가 붙는다. ${SUBJ[subj]} 섹션을 다 읽으면 ${bp.pass+1}회독으로 넘어가고 ✓는 다시 비워진다.</p>`;
  }
  main.innerHTML=html;
  main.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{ st.subj=b.dataset.subj; save(); renderToc(); });
  main.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ bk.open[b.dataset.ch]=!bk.open[b.dataset.ch]; const y=window.scrollY; renderToc(); window.scrollTo(0,y); });
  main.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ bk.tocY=window.scrollY; openSection(b.dataset.sec); });

  const inp=main.querySelector('#bks');
  inp.oninput=()=>{ bk.q=inp.value; clearTimeout(inp._t); inp._t=setTimeout(()=>{ renderToc(); const i2=main.querySelector('#bks'); i2.focus(); i2.setSelectionRange(i2.value.length,i2.value.length); },250); };
  if(bk.tocY){ const y=bk.tocY; bk.tocY=0; requestAnimationFrame(()=>window.scrollTo(0,y)); }
}
function openSection(id){ bk.sec=id; bk.memo=false; render(); }
function searchResults(q){
  const ql=q.toLowerCase(); const hits=[];
  const mark=t=>{ const i=t.toLowerCase().indexOf(ql); if(i<0) return null; const a=Math.max(0,i-24); return (a?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,i+q.length+40))+'…'; };
  for(const s of Object.values(B.sections)){
    const pool=[s.title,s.law||'',s.one||'',...(s.concept||[]),...(s.traps||[]),s.memo||'',...(s.tables||[]).flatMap(t=>[t.title||'',...(t.head||[]),...t.rows.flat()]),...(s.calc||[]).flatMap(c=>[c.name,c.formula]),...s.ox.flatMap(o=>[o.text,o.fix||'',o.why||''])].map(plain);
    let first=null, n=0; for(const t of pool){ if(t.toLowerCase().includes(ql)){ n++; if(!first) first=mark(t); } }
    if(n) hits.push({s,n,first,score:(s.title.toLowerCase().includes(ql)?1000:0)+n});
  }
  hits.sort((a,b)=>b.score-a.score);
  if(!hits.length) return `<div class="card muted">'${esc(q)}'(이)가 들어간 섹션이 없습니다.</div>`;
  return `<div class="card" style="padding:6px 14px">${hits.slice(0,40).map(h=>`<button class="srow" data-sec="${h.s.id}"><span class="tag ${h.s.grade}">${h.s.grade}</span><span class="t">${esc(h.s.title)} <span class="muted" style="font-size:12px">${h.s.ch[0]==='C'?'민법':'학개론'} · ${h.n}곳</span><div class="hit">${h.first||''}</div></span></button>`).join('')}</div>`;
}
function tableHtml(t){
  // t.s: 행마다 풀어 쓴 문장. 첫 칸(개념 이름)은 두 줄로 세로 병합해 개념별 묶음을 유지하고,
  // 문장은 나머지 칸만 병합한 줄에 쓴다(10-25 PD: '취소권' 밑까지 병합하지 말고 기간·출발점 칸만)
  const has=i=>t.s&&t.s[i]&&t.rows[i].length>1;
  const row=(r,i)=>`<tr>${r.map((c,k)=>`<td${k===0&&has(i)?' rowspan="2"':''}>${md(c)}</td>`).join('')}</tr>`
    +(has(i)?`<tr class="trs" data-i="${i}"><td colspan="${t.rows[i].length-1}">${esc(t.s[i])}</td></tr>`:'');
  return `<div class="tw"><table>${t.title?`<caption>${md(t.title)}</caption>`:''}${t.head&&t.head.length?`<thead><tr>${t.head.map(h=>`<th>${md(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${t.rows.map(row).join('')}</tbody></table></div>`;
}
// 틀린 지문과 바로잡은 문장을 낱말 단위로 비교해 바뀐 곳만 표시
function wordDiff(a,b){
  const A=a.split(/(\s+)/).filter(x=>x!==''), Bw=b.split(/(\s+)/).filter(x=>x!=='');
  const n=A.length, m=Bw.length; if(n*m>40000) return null;
  const L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=A[i]===Bw[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0, ra='', rb='';
  while(i<n||j<m){
    if(i<n&&j<m&&A[i]===Bw[j]){ ra+=esc(A[i]); rb+=esc(Bw[j]); i++; j++; }
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ rb+=/^\s+$/.test(Bw[j])?Bw[j]:'<ins>'+esc(Bw[j])+'</ins>'; j++; }
    else { ra+=/^\s+$/.test(A[i])?A[i]:'<del>'+esc(A[i])+'</del>'; i++; }
  }
  return {a:ra,b:rb};
}
function oxStatus(o){
  if(!o.c) return '';
  let del=0, miss=0, seen=0;
  for(const id of o.c){ const st=S.cards[id]; if(!st) continue; if(st.st===2) del++; miss+=st.miss||0; seen+=st.seen||0; }
  if(miss) return `<span class="dot miss">틀린 적 ${miss}</span>`;
  if(del&&del===o.c.length) return '<span class="dot del">지움</span>';
  if(seen) return '<span class="dot ok">맞힘</span>';
  return '';
}

/* ===== 패턴 =====
   patterns.json(앱/패턴_만들기.py): 선지 읽는 법(데이터), 과목별 '이것만' 패턴, 두 회차 이상 또 나온 문장.
   기록: S.pat(본 기록), S.rep(또 나온 문장 O/X 결과). 동기화 단위는 t/, e/ */
let P=null, patLoading=null, C2P={};
const pt={id:null, tab:'civ', from:null, hide:true, memo:false, rf:{subj:'all',min:3}, drill:null, tabY:0};
function loadPat(){
  if(P) return Promise.resolve(P);
  if(!patLoading) patLoading=fetch('patterns.json?v='+Date.now()).then(r=>r.json()).then(d=>{ P=d; C2P={}; for(const p of P.patterns) for(const id of p.cards) (C2P[id]=C2P[id]||[]).push(p.id); return P; }).catch(e=>{ patLoading=null; throw e; });
  return patLoading;
}
function patById(id){ return P&&P.patterns.find(p=>p.id===id); }
function patsOf(subj){ return P.patterns.filter(p=>p.subj===subj); }
function patLive(p){ if(!D) return []; const ids=new Set(p.cards); return D.cards.filter(c=>ids.has(c.id)&&cardState(c.id).st!==2); }
function patSeen(id){ return seenRec(S.pat[id]); }
function markPatSeen(id){ if(markSeen(S.pat,id)) save(); }
function patPass(){ return seenPass(S.pat,P.patterns.map(p=>p.id)); }
function patLabel(pp){ return `${pp.pass===1?'봤다':pp.pass+'회독'} ${pp.done} / ${pp.total}`; }
function patNext(pass){ const left=P.patterns.filter(p=>patSeen(p.id).n<pass); return left.find(p=>p.level==='S')||left[0]; }
function patName(p){ return p.name||p.title; }
function patLinks(cid){
  if(!P||!C2P[cid]) return '';
  return C2P[cid].slice(0,2).map(id=>`<button class="patbtn" data-pat="${id}">★ 패턴 · ${esc(patName(patById(id)))}</button>`).join('');
}
// 패턴 요점 글: 괄호(예시·보충)는 작은 회색, 따로 선 O/X는 색 배지, 줄은 첫 '→'(괄호 밖)에서 조건과 판정으로 가른다
function oxBadge(h){ return h.replace(/(^|[\s(,·/])([OX])(?=$|[\s),.·/(])/g,'$1<b class="okx $2">$2</b>'); }
function ptInline(s){
  let out='', buf='', dep=0;
  const flush=paren=>{ if(!buf) return; const h=oxBadge(md(buf)).replace(/→/g,'<i class="ar">→</i>'); out+=paren?`<span class="px">${h}</span>`:h; buf=''; };
  for(const ch of s){
    if(ch==='('){ if(!dep) flush(false); dep++; buf+=ch; }
    else if(ch===')'&&dep){ buf+=ch; if(!--dep) flush(true); }
    else buf+=ch;
  }
  flush(dep>0);
  return out;
}
function ptLine(s){
  let dep=0, at=-1, n=0;
  for(let i=0;i<s.length;i++){ const c=s[i]; if(c==='(') dep++; else if(c===')') dep=Math.max(0,dep-1); else if(c==='→'&&!dep){ if(at<0) at=i; n++; } }
  if(at<0||n>1) return ptInline(s);  // '→'가 둘 이상이면 순서(동심원 → 선형 → 다핵심)라 가르지 않는다
  return `<span class="pc">${ptInline(s.slice(0,at).trim())}</span><i class="ar">→</i><span class="pr">${ptInline(s.slice(at+1).trim())}</span>`;
}
function openPat(id,from){ pt.id=id; pt.from=from||null; pt.memo=false; pt.drill=null; goView('pat'); }
function runCards(q){ view='today'; document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.v==='today')); startSession(q); }
function keepY(f){ const y=window.scrollY; f(); window.scrollTo(0,y); }
function renderPat(){
  if(!P){
    main.innerHTML='<div class="card muted">패턴 불러오는 중…</div>';
    loadPat().then(()=>{ if(view==='pat') renderPat(); }).catch(()=>{ if(view==='pat') main.innerHTML='<div class="card">패턴(patterns.json)을 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div>'; });
    return;
  }
  if(!AU) loadAudio().then(a=>{ if(view==='pat'&&!pt.drill&&!pt.memo&&Object.keys(a.patterns).length) keepY(renderPat); });  // 듣기 버튼은 오디오 목록이 오면 붙인다
  if(pt.drill) return renderDrill();
  if(pt.id&&patById(pt.id)) return renderPatDetail(pt.id);
  if(pt.memo) return renderPatMemos();
  renderPatList();
}

  bar.querySelector('#apTi').innerHTML=`${esc(m.t)}<small>${esc(m.s)}</small>`;
  bar.querySelector('#apRate').textContent=ap.el.playbackRate+'×';
  if('mediaSession' in navigator&&window.MediaMetadata) navigator.mediaSession.metadata=new MediaMetadata({title:m.t, artist:m.a, album:'기출지우개 : 공인중개사 2027'});
}
// 재생 막대 제목을 누르면 지금 듣는 것이 있는 화면으로
function apOpen(){
  const id=ap.q[ap.i]; if(!id) return;
  if(ap.kind==='patterns') return openPat(id);
  if(ap.kind==='tsx'){ ot.id=id; return goView('other'); }
  if(ap.kind==='rep'){ pt.id=null; pt.memo=false; pt.drill=null; pt.tab='rep'; return goView('pat'); }
  if(ap.kind==='memo'&&B&&B.chapters[id]){
    const st=bookState(); st.subj=B.chapters[id].subject; bk.sec=null; bk.memo=true; goView('book');

// at: 그 패턴 안에서 시작할 초(소제목 ▶). 듣던 패턴이면 다시 받지 않고 그 자리로만 옮긴다
function apGo(i,at){
  const a=apEl();
  if(i<0||i>=ap.q.length){ a.pause(); return; }  // 목록 끝까지 들었으면 멈춘다
  const url=AUDIO_BASE+AU[ap.kind][ap.q[i]].file;
  if(i===ap.i&&a.src===url&&a.readyState>0){ if(at!=null) a.currentTime=at; }
  else { a.src=url; if(at) a.addEventListener('loadedmetadata',()=>{ a.currentTime=at; },{once:true}); }
  ap.i=i; a.defaultPlaybackRate=a.playbackRate=apRate(); a.play().catch(()=>{});
  document.getElementById('aplayer').classList.add('on'); document.body.classList.add('aplay');
  apInfo();
}
// kind: 'patterns'(기본)·'tsx'·'rep'·'memo'
function apStart(ids,from,at,kind){ const k=kind||'patterns', q=ids.filter(id=>hasAudio(id,k)); if(!q.length) return; if(k!==ap.kind||q.join()!==ap.q.join()) ap.i=-1; ap.kind=k; ap.q=q; apGo(Math.max(0,q.indexOf(from)),at); }
// 지금 읽는 부분: 그 화면(패턴·타시험 카드·외우기 모음)을 보고 있을 때만 파란 테두리
function apSecNow(){ const it=auItem(), pa=it&&it.parts; if(!pa||!ap.el) return null; let cur=null, best=-1; for(const k in pa){ const t=pa[k]; if(t<=ap.el.currentTime+0.05&&t>best){ best=t; cur=k; } } return cur; }
function apHere(){ const id=ap.q[ap.i]; return ap.kind==='patterns'?view==='pat'&&pt.id===id:ap.kind==='tsx'?view==='other'&&ot.id===id:ap.kind==='memo'?view==='book'&&bk.memo&&!bk.sec:false; }
function apMark(){
  const on=ap.el&&!ap.el.paused&&apHere()?apSecNow():null;
  main.querySelectorAll('[data-psec]').forEach(el=>el.classList.toggle('secnow',el.dataset.psec===on));
}
// 또 나온 문장: 두 회차 이상 나온 지문. O/X 퀴즈 또는 목록
function repPool(){ const f=pt.rf; return P.repeats.filter(r=>(f.subj==='all'||r.subj===f.subj)&&r.rounds.length>=f.min); }
function repLast(r){ const s=S.rep[r.ref]; return s?s.l:-1; }
function repHtml(){

  const n3=P.repeats.filter(r=>r.rounds.length>=3).length, todo=pool.length-known;

    <div class="chips">${[['all','둘 다'],['civ','민법'],['rea','학개론']].map(([k,l])=>`<button class="chipbtn ${f.subj===k?'on':''}" data-rs="${k}">${l}</button>`).join('')}<span style="width:6px"></span>${[[3,'3회 이상'],[2,'2회 이상']].map(([k,l])=>`<button class="chipbtn ${f.min===k?'on':''}" data-rm="${k}">${l}</button>`).join('')}</div>
    <div class="stat"><div><b>${pool.length}</b><span>문장</span></div><div><b>${known}</b><span>마지막에 맞힘</span></div><div><b>${missed}</b><span>마지막에 틀림</span></div></div>
    <div class="btns"><button class="btn n small" id="repGo">▶ O/X 퀴즈 ${todo||pool.length}개</button></div>
    <div class="btns" style="margin-top:8px">${missed?`<button class="btn x small" id="repMiss">틀린 것만 ${missed}개</button>`:''}<button class="btn ghost small" id="repList">목록으로 읽기</button></div>
    ${au.length?`<div class="btns" style="margin-top:8px"><button class="btn ghost small" id="repAu">🔊 내 목소리로 ${au.length}개 듣기</button>${auMiss.length?`<button class="btn ghost small" id="repAuMiss">🔊 틀린 것만 ${auMiss.length}개</button>`:''}</div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">지문 → 2초 생각 → 맞는 말 / 틀린 말·바르게는 → 해설.${au.length<pool.length?` 소리는 아직 ${au.length}개(3회 이상 나온 문장)만 있습니다.`:''}</p>`:''}</div>`;
}
function bindRep(){
  main.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{ pt.rf.subj=b.dataset.rs; keepY(renderPatList); });
  main.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ pt.rf.min=+b.dataset.rm; keepY(renderPatList); });
  const pool=repPool();
  main.querySelector('#repGo').onclick=()=>{ const q=pool.filter(r=>repLast(r)!==1); startDrill(q.length?q:pool,'quiz'); };
  const rm=main.querySelector('#repMiss'); if(rm) rm.onclick=()=>startDrill(pool.filter(r=>repLast(r)===0),'quiz');
  main.querySelector('#repList').onclick=()=>startDrill(pool,'list');
  const au=pool.filter(r=>hasAudio(r.ref,'rep')).map(r=>r.ref);
  const ra=main.querySelector('#repAu'); if(ra) ra.onclick=()=>apStart(au,null,null,'rep');
  const rx=main.querySelector('#repAuMiss'); if(rx) rx.onclick=()=>apStart(pool.filter(r=>repLast(r)===0).map(r=>r.ref),null,null,'rep');
}
function startDrill(q,mode){ pt.drill={q, i:0, phase:'ask', pick:null, mode, ok:0}; window.scrollTo(0,0); renderDrill(); }
function renderDrill(){
  const d=pt.drill, quit=()=>{ pt.drill=null; pt.tab='rep'; render(); };
  if(d.mode==='list'){
    main.innerHTML=`<div class="reader"><div class="row"><button class="linkbtn" id="dx">‹ 패턴</button><span class="muted" style="font-size:12px">${d.q.length}개</span></div>
      <h2 class="st">또 나온 문장</h2>
      <div class="row" style="margin-bottom:4px"><span class="muted" style="font-size:12px">${pt.hide?'지문을 누르면 정답과 근거가 열립니다.':'빨간 줄은 바꾼 말, 주황 칸은 지어낸 말, 초록은 바로잡은 말.'}</span><button class="chipbtn ${pt.hide?'on':''}" id="hideAns">${pt.hide?'답 가림':'답 가리기'}</button></div>
      <ul class="oxl ${pt.hide?'hideans':''}" id="oxl">${d.q.map(patOxHtml).join('')}</ul></div>`;
    main.querySelector('#dx').onclick=quit;
    main.querySelector('#hideAns').onclick=()=>{ pt.hide=!pt.hide; keepY(renderDrill); };
    bindOx(); return;
  }
  if(d.i>=d.q.length){
    main.innerHTML=`<div class="card center"><div class="verdict ${d.ok===d.q.length?'ok':''}">${d.q.length}개 중 ${d.ok}개 맞힘</div><p class="muted">틀린 문장은 '틀린 것만'으로 다시 돌릴 수 있습니다.</p><div class="btns"><button class="btn n" id="dx">끝</button></div></div>`;
    main.querySelector('#dx').onclick=quit; return;
  }
  const r=d.q[d.i];
  let html=`<div class="row"><span class="muted">${d.i+1} / ${d.q.length}</span><button class="btn ghost small" style="flex:0 0 auto;padding:6px 10px" id="dx">그만</button></div>
  <div class="card"><div><span class="tag">${SUBJ[r.subj]} · ${r.rounds.join('·')}회</span>${lawHtml(r.ref)}</div><div class="muted" style="font-size:12px;margin-top:4px">${esc(r.st||'')}</div>
    <div class="ask truth">이 문장은 <b>옳은 말인가요?</b><span>${r.rounds.length}개 회차에 나온 문장. 정오는 매번 같았다.</span></div>`;
  if(r.case) html+=`<div class="passage"><b>사례</b> ${esc(r.case)}</div>`;
  if(d.phase==='ask'){
    html+=`<div class="choice">${esc(r.text)}</div><div class="btns"><button class="btn o" data-p="O">O 옳은 말</button><button class="btn x" data-p="X">X 틀린 말</button></div></div>`;
  } else {
    const ok=d.pick===r.ox, df=r.ox==='X'&&r.fix?fixDiff(r):null;
    html+=`<div class="choice">${df?df.a:esc(r.text)}</div>
      <div class="verdict ${ok?'ok':'bad'}">${ok?'맞음':'틀림'} · 정답은 ${r.ox==='O'?'O 옳은 말':'X 틀린 말'}</div>
      ${r.ox==='X'&&r.fix?`<div class="fix">바로잡기: ${df?df.b:esc(r.fix)}</div>${edLegend(r.ed)}`:''}${r.fk?`<div class="fake"><b>그럴듯하게 지어낸 말</b>${md(r.fk)}</div>`:''}
      ${r.why?`<div class="reason">${md(r.why)}</div>`:''}
      <button class="bookbtn" data-book="${r.sec}">📖 개념서에서 읽기 · ${esc(r.st||'')}</button>
      <div class="btns" style="margin-top:12px"><button class="btn n" id="dn">다음</button></div></div>`;
  }
  main.innerHTML=html;
  main.querySelector('#dx').onclick=quit;
  main.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    d.pick=b.dataset.p; d.phase='show'; const ok=d.pick===r.ox; if(ok) d.ok++;
    const s=S.rep[r.ref]||{n:0,ok:0}; S.rep[r.ref]={n:(s.n||0)+1, ok:(s.ok||0)+(ok?1:0), l:ok?1:0, d:today()}; save(); renderDrill();
  });
  const dn=main.querySelector('#dn'); if(dn) dn.onclick=()=>{ d.i++; d.phase='ask'; d.pick=null; window.scrollTo(0,0); renderDrill(); };
  main.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{ bk.sec=b.dataset.book; bk.memo=false; bk.from='pat'; goView('book'); });
}
// 오늘 탭 맨 위: 이번 회독에 아직 안 본 패턴 중 다음 것(S급 먼저). 1회독 중에는 굵은 테두리

const TS_EX=['감평','주관','노무','행정','세무','9급','법무','변시'];
function loadTs(){

    d.rea=d.rea.map(a=>({id:a.id, subj:'rea', rank:a.score===3?1:a.score===2?2:3, title:a.topic, why:a.why, unit:a.unit,

      lines:[{t:a.statement, trap:a.trap, calc:a.calc, r:a.src}]}));
    d.civ.forEach(c=>c.subj='civ');
